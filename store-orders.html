<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單明細 — 店家後台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #f3f2ef;
  --card:        #ffffff;
  --bg-2:        #fafaf9;
  --bg-3:        #eeece9;
  --border:      #e5e5e4;
  --border-2:    #efefed;
  --text:        #1c1b1a;
  --text-2:      #57534e;
  --text-3:      #78716c;
  --blue:        #1d4ed8;
  --blue-bg:     #eff6ff;
  --blue-border: #bfdbfe;
  --blue-text:   #1e40af;
  --green:       #15803d;
  --green-bg:    #f0fdf4;
  --green-bdr:   #bbf7d0;
  --orange:      #c2410c;
  --orange-bg:   #fff7ed;
  --orange-bdr:  #fed7aa;
  --red:         #b91c1c;
  --red-bg:      #fef2f2;
  --red-bdr:     #fecaca;
  --purple:      #7c3aed;
  --purple-bg:   #f5f3ff;
  --purple-bdr:  #ddd6fe;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
               "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}

.page { max-width: 1280px; margin: 0 auto; padding: 12px 20px 80px; }
.page-header { margin-bottom: 20px; }
.page-title  { font-size: 22px; font-weight: 600; }
.page-sub    { font-size: 17px; color: var(--text-3); margin-top: 3px; }

/* ── 工具列 ── */
.toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
  
}
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-nav-label { font-size: 17px; font-weight: 500; min-width: 96px; text-align: center; }
.btn-nav {
  padding: 4px 11px; border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg); color: var(--text-2); cursor: pointer; font-size: 15px;
}
.btn-nav:hover:not(:disabled) { background: var(--bg-2); }
.btn-nav:disabled { opacity: .3; cursor: default; }

.meal-filter-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.meal-pill {
  padding: 4px 13px; border-radius: 100px;
  border: 1px solid var(--border); font-size: 15px; cursor: pointer;
  background: var(--bg); color: var(--text-2); transition: all .12s; user-select: none;
}
.meal-pill:hover { border-color: #a8a29e; }
.meal-pill.on { background: var(--text); color: #fff; border-color: var(--text); }

/* ── 兩欄佈局 ── */
.orders-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 16px;
  align-items: start;
}

/* ── 左側日期列表 ── */
.date-list-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}
.date-list-hd {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 15px; font-weight: 600; color: var(--text-2);
}
.date-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-2);
  cursor: pointer;
  transition: background .1s;
}
.date-item:last-child { border-bottom: none; }
.date-item:hover { background: var(--bg-2); }
.date-item.active { background: var(--blue-bg); border-left: 3px solid var(--blue); }
.date-item-date { font-size: 16px; font-weight: 500; }
.date-item-meta { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.date-list-empty { padding: 28px 14px; text-align: center; color: var(--text-3); font-size: 15px; }

/* ── 右側訂單明細 ── */
.order-detail-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.order-detail-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 320px; color: var(--text-3); gap: 10px;
}
.order-detail-placeholder .icon { font-size: 40px; }
.order-detail-placeholder p { font-size: 17px; }

.order-date-title {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 18px; font-weight: 600;
}

/* 數量 */
.qty-zero { color: var(--text-3); }
.qty-val  { font-weight: 700; color: var(--text); font-size: 16px; }

/* ── 供餐方案卡片 ── */
.svc-card {
  border-radius: 10px; overflow: hidden;
  margin: 0 20px 16px;
}
.svc-card:last-child { margin-bottom: 4px; }

.svc-card-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px 12px;
  font-size: 16px; font-weight: 700;
}
.svc-card-hd .svc-meal-tag {
  font-size: 15px; font-weight: 700;
  padding: 2px 10px; border-radius: 20px;
  margin-right: 8px; letter-spacing: .03em;
}
.svc-system   .svc-meal-tag { background: #0d76b5; color: #fff; }
.svc-internal .svc-meal-tag { background: #92400e; color: #fff; }
.svc-meeting  .svc-meal-tag { background: #6d28d9; color: #fff; }
.svc-card-hd .svc-title-wrap { display: flex; align-items: center; }
.svc-card-hd .svc-sub { font-size: 15px; font-weight: 700; opacity: 1; }

.svc-item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 18px;
  font-size: 15px;
}
.svc-item-row + .svc-item-row { border-top: 1px solid; }
.svc-item-name { color: var(--text); }
.svc-item-qty  { font-weight: 700; font-size: 16px; white-space: nowrap; }
.svc-item-qty .svc-item-unit { font-size: 15px; font-weight: 700; margin-left: 2px; }

.svc-item-modified { position: relative; }
.svc-item-original { font-size: 12px; text-decoration: line-through; opacity: .5; margin-right: 6px; }
.svc-item-removed  { font-size: 15px; font-weight: 700; }

.svc-version-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 13px;
  border-top: 1px solid;
}

/* 系統訂餐 — 藍 */
.svc-system .svc-card-hd        { background: #c5e5fc; color: #0d76b5; }
.svc-system .svc-item-row       { background: #dbeeff; border-color: #a8d4f5; }
.svc-system .svc-item-qty       { color: #0d76b5; }
.svc-system .svc-version-bar    { background: #c5e5fc; border-color: #a8d4f5; color: #0d76b5; }

/* 內部訂餐 — 黃橘 */
.svc-internal .svc-card-hd      { background: #fde68a; color: #92400e; }
.svc-internal .svc-item-row     { background: #fef3c7; border-color: #fcd34d; }
.svc-internal .svc-item-qty     { color: #92400e; }
.svc-internal .svc-version-bar  { background: #fde68a; border-color: #fcd34d; color: #92400e; }

/* 會議餐 — 紫 */
.svc-meeting .svc-card-hd       { background: #ddd6fe; color: #6d28d9; }
.svc-meeting .svc-item-row      { background: #ede9fe; border-color: #c4b5fd; }
.svc-meeting .svc-item-qty      { color: #6d28d9; }
.svc-meeting .svc-version-bar   { background: #ddd6fe; border-color: #c4b5fd; color: #6d28d9; }

/* ── 菜單版本提示條 ── */
.menu-version-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; font-size:13px; color:#c2410c; margin-bottom:12px; }
.date-mod-tag { display:inline-block; font-size:11px; padding:0 6px; margin-left:6px; border-radius:10px; background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
.item-modified-badge { display:inline-block; font-size:11px; padding:0 5px; border-radius:8px; background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; margin-left:6px; vertical-align:middle; }
.item-original-qty { font-size:12px; color:#b91c1c; text-decoration:line-through; margin-right:4px; }
tr.item-modified { background:#fff7ed; }
.item-note-cell { font-size:12px; color:#78716c; padding-top:0 !important; border-top:none !important; }

/* ── RWD ── */
@media (max-width: 860px) {
  .orders-layout { grid-template-columns: 1fr; }
  .date-list-panel { position: static; max-height: none; }
}

/* ═══════════════════════════════════════════════

/* ═══════════════════════════════════════════════

const currentStore = {

/* ═══════════════════════════════════════════════

   orderData[dateStr][mealType] = { totalQty, branches: [...] }
   每個 branch = { branchCode, branchName, branchTotal, items:[{itemCode,itemName,qty}] }
═══════════════════════════════════════════════ */
/* orderData[dateStr] = [ { serviceType, mealType, totalQty, menuVersion?, menuUpdatedAt?, branches:[...] } ] */
const orderData = {

          ]

    },

    }
  ],
  '2026-04-23': [

          items: [
            { itemCode: '9990014002', itemName: '迷你秋刀魚丼',       qty: 25,
              modified: { field: 'qty', originalQty: 20, note: '菜單更新（04/17 09:00）' } },
            { itemCode: '9990014026', itemName: '日式煎餃花蛤味噌湯', qty: 10 },
          ]
        },

          items: [

          ]

    },

      totalQty: 3,

          items: [

  ],
  '2026-04-29': [

          ]
        }
      ]
    }
  ]
};

/* ═══════════════════════════════════════════════
   狀態
═══════════════════════════════════════════════ */
let curMonth     = 3;  // 4月（0-indexed）
let activeDateStr = null;
let mealFilter   = 'all';

/* ═══════════════════════════════════════════════
   工具
═══════════════════════════════════════════════ */
function getMealInfo(id) { return MEAL_TYPES.find(m => m.id === id) || { id, label: id, chipCls: '' }; }
function getMonthDates() {
  const y = YEAR, m = curMonth;
  const mmStr = String(m + 1).padStart(2, '0');
  const start = `${y}-${mmStr}-01`;
  const endDay = new Date(y, m + 1, 0).getDate();
  const end = `${y}-${mmStr}-${String(endDay).padStart(2, '0')}`;
  return { start, end };
}

/* ═══════════════════════════════════════════════
   渲染月份篩選 pills
═══════════════════════════════════════════════ */
function renderMealFilter() {
  document.getElementById('meal-filter-wrap').innerHTML =
    MEAL_TYPES.map(m =>
      `<div class="meal-pill${m.id === mealFilter ? ' on' : ''}" onclick="selectMealFilter('${m.id}')">${m.label}</div>`
    ).join('');
}

function selectMealFilter(id) {
  mealFilter = id;
  renderMealFilter();
  renderDateList();
  if (activeDateStr) {
    const dates = getFilteredDates();
    if (dates.includes(activeDateStr)) {
      renderOrderDetail(activeDateStr);
    } else {
      activeDateStr = null;
      document.getElementById('order-detail-panel').innerHTML = `
        <div class="order-detail-placeholder">
          <div class="icon">📦</div>
          <p>請從左側選擇日期查看訂單明細</p>
        </div>`;
    }
  }
}

/* ═══════════════════════════════════════════════
   左側日期列表
═══════════════════════════════════════════════ */
function getFilteredDates() {
  const { start, end } = getMonthDates();
  return Object.keys(orderData)
    .filter(d => {
      if (d < start || d > end) return false;
      if (mealFilter === 'all') return true;
      return orderData[d].some(e => e.mealType === mealFilter);
    })
    .sort();
}

function renderDateList() {
  const dates = getFilteredDates();
  const el = document.getElementById('date-list-body');
  if (!dates.length) {
    el.innerHTML = '<div class="date-list-empty">本月無已發布排程</div>';
    return;
  }
  el.innerHTML = dates.map(d => {
    const dt = new Date(d);
    const entries = mealFilter === 'all'
      ? orderData[d]
      : orderData[d].filter(e => e.mealType === mealFilter);
    const totalQty = entries.reduce((s, e) => s + e.totalQty, 0);
    const hasModification = entries.some(e => (e.menuVersion || 1) > 1);
    const modTag = hasModification ? `<span class="date-mod-tag">有修正</span>` : '';
    const seenMeals = new Set();
    const mealChips = entries
      .filter(e => { if (seenMeals.has(e.mealType)) return false; seenMeals.add(e.mealType); return true; })
      .map(e => {
        const mi = getMealInfo(e.mealType);
        return `<span class="meal-chip ${mi.chipCls}">${mi.label}</span>`;
      }).join(' ');
    return `<div class="date-item${d === activeDateStr ? ' active' : ''}" onclick="selectDate('${d}')">
      <div class="date-item-date">${d.slice(5).replace('-','/')}（週${WD_NAMES[dt.getDay()]}）</div>
      <div class="date-item-meta">${mealChips}　共 ${totalQty} 份${modTag}</div>
    </div>`;
  }).join('');
}

function selectDate(dateStr) {
  activeDateStr = dateStr;
  renderDateList();
  renderOrderDetail(dateStr);
}

/* ═══════════════════════════════════════════════
   右側訂單明細
═══════════════════════════════════════════════ */
const SVC_ORDER = ['system', 'internal', 'meeting'];
const SVC_META = {
  system:   { cls: 'svc-system',   label: '系統訂餐' },
  internal: { cls: 'svc-internal', label: '內部訂餐' },
  meeting:  { cls: 'svc-meeting',  label: '會議餐'   },
};
const MEAL_ORDER = ['breakfast','lunch','afternoon','dinner','latenight'];

function renderMealBlock(entry, meta) {
  const svcLabel = meta.label;
  const mi = getMealInfo(entry.mealType);

  // 合併所有分店品項，同名品項加總
  const itemMap = new Map();
  entry.branches.forEach(branch => {
    branch.items.forEach(item => {
      const key = item.itemCode;
      if (itemMap.has(key)) {
        const existing = itemMap.get(key);
        existing.qty += item.qty;
        if (item.modified) existing.modified = item.modified;
      } else {
        itemMap.set(key, { ...item });
      }
    });
  });

  let itemsHtml = '';
  itemMap.forEach(item => {
    const hasModified = !!item.modified;
    let qtyHtml;
    if (hasModified && item.modified.field === 'removed') {
      qtyHtml = `<span class="svc-item-removed" style="color:#b91c1c">
        <span class="svc-item-original">${item.modified.originalQty} 份</span>已移除
      </span>`;
    } else if (hasModified) {
      qtyHtml = `<span class="svc-item-qty">
        <span class="svc-item-original">${item.modified.originalQty}</span>${item.qty}<span class="svc-item-unit">份</span>
      </span>`;
    } else {
      qtyHtml = item.qty > 0
        ? `<span class="svc-item-qty">${item.qty}<span class="svc-item-unit">份</span></span>`
        : `<span class="qty-zero">—</span>`;
    }
    const modNote = hasModified
      ? `<span style="font-size:12px;opacity:.6;margin-left:6px">${item.modified.note}</span>` : '';
    itemsHtml += `<div class="svc-item-row${hasModified ? ' svc-item-modified' : ''}">
      <span class="svc-item-name">${item.itemName}${modNote}</span>
      ${qtyHtml}
    </div>`;
  });

  let versionBarHtml = '';
  if (entry.menuVersion && entry.menuVersion > 1) {
    versionBarHtml = `<div class="svc-version-bar">
      ⚠ 菜單已於 ${entry.menuUpdatedAt} 更新，如有疑問請聯繫營運部
    </div>`;
  }

  return `<div class="svc-card ${meta.cls}">
    <div class="svc-card-hd">
      <span class="svc-title-wrap">
        <span class="svc-meal-tag">${mi.label}</span>
        <span>${svcLabel}</span>
      </span>
      <span class="svc-sub">共 ${entry.totalQty} 份</span>
    </div>
    ${itemsHtml}
    ${versionBarHtml}
  </div>`;
}

function renderOrderDetail(dateStr) {
  const allEntries = orderData[dateStr];
  if (!allEntries) return;

  const dt = new Date(dateStr);
  const dateLabel = `${dateStr.slice(0,4)}年${dateStr.slice(5,7)}月${dateStr.slice(8,10)}日（週${WD_NAMES[dt.getDay()]}）`;

  const filtered = mealFilter === 'all'
    ? allEntries
    : allEntries.filter(e => e.mealType === mealFilter);

  if (!filtered.length) {
    document.getElementById('order-detail-panel').innerHTML = `
      <div class="order-date-title">${dateLabel}</div>
      <div class="order-detail-placeholder" style="min-height:200px">
        <p>本日此餐期無排程資料</p>
      </div>`;
    return;
  }

  let html = `<div class="order-date-title">${dateLabel}</div><div style="height:12px"></div>`;

  SVC_ORDER.forEach(svcType => {
    const svcEntries = filtered
      .filter(e => e.serviceType === svcType)
      .sort((a, b) => MEAL_ORDER.indexOf(a.mealType) - MEAL_ORDER.indexOf(b.mealType));
    if (!svcEntries.length) return;

    const meta = SVC_META[svcType];
    svcEntries.forEach(entry => { html += renderMealBlock(entry, meta); });
  });

  document.getElementById('order-detail-panel').innerHTML = html;
}

/* ═══════════════════════════════════════════════
   月份導覽
═══════════════════════════════════════════════ */
function changeMonth(delta) {
  curMonth = Math.max(MIN_M, Math.min(MAX_M, curMonth + delta));
  document.getElementById('month-label').textContent = `${YEAR}年${MONTH_NAMES[curMonth]}`;
  document.getElementById('btn-prev').disabled = curMonth <= MIN_M;
  document.getElementById('btn-next').disabled = curMonth >= MAX_M;
  activeDateStr = null;
  renderDateList();
  document.getElementById('order-detail-panel').innerHTML = `
    <div class="order-detail-placeholder">
      <div class="icon">📦</div>
      <p>請從左側選擇日期查看訂單明細</p>
    </div>`;
}

/* ═══════════════════════════════════════════════
   初始化
═══════════════════════════════════════════════ */
document.getElementById('btn-prev').disabled = curMonth <= MIN_M;
document.getElementById('btn-next').disabled = curMonth >= MAX_M;
renderMealFilter();
renderDateList();
</script>
