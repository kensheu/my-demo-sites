<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/png" href="圖片/LOGO.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報表 — 內部後台</title>
  <link rel="stylesheet" href="shared-nav.css">
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #f3f2ef;
  --card:        #ffffff;
  --bg-2:        #fafaf9;
  --bg-3:        #eeece9;
  --border:      #e5e5e4;
  --border-2:    #efefed;
  --text:        #1c1b1a;
  --text-2:      #57534e;
  --text-3:      #78716c;
  --blue:        #1d4ed8;
  --blue-bg:     #eff6ff;
  --blue-border: #bfdbfe;
  --blue-text:   #1e40af;
  --green:       #15803d;
  --green-bg:    #f0fdf4;
  --green-bdr:   #bbf7d0;
  --orange:      #c2410c;
  --orange-bg:   #fff7ed;
  --orange-bdr:  #fed7aa;
  --red:         #b91c1c;
  --red-bg:      #fef2f2;
  --red-bdr:     #fecaca;
  --yellow:      #a16207;
  --yellow-bg:   #fefce8;
  --yellow-bdr:  #fde68a;
  --gray-disabled: #d1d5db;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
               "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}

.page { max-width: 1400px; margin: 0 auto; padding: 12px 20px 80px; }

/* ─── 麵包屑 ─── */
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 16px;
  font-size: 14px; color: var(--text-3);
}
.bc-item { color: var(--text-2); }
.bc-home { font-weight: 600; color: var(--text); }
.bc-sep  { color: var(--text-3); }
.bc-link { cursor: pointer; }
.bc-link:hover { color: var(--blue); text-decoration: underline; }

/* ─── Header ─── */
.page-header { margin-bottom: 12px; }
.page-title  { font-size: 22px; font-weight: 600; }
.page-sub    { font-size: 15px; color: var(--text-3); margin-top: 3px; }

/* ─── Toolbar ─── */
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
}
.toolbar-label { font-size: 15px; color: var(--text-2); white-space: nowrap; }
.toolbar-tilde { color: var(--text-3); font-size: 15px; }
.date-input {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 15px; color: var(--text); background: var(--card); cursor: pointer;
  font-family: inherit;
}
.date-input:focus { outline: none; border-color: var(--blue); }

/* ─── 按鈕 ─── */
.btn {
  padding: 7px 14px; border-radius: 6px;
  font-size: 15px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text-2);
  transition: all .12s; display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap; font-family: inherit;
}
.btn:hover { border-color: #a8a29e; color: var(--text); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #1e40af; border-color: #1e40af; color: #fff; }

/* ─── 操作按鈕（表格內） ─── */
.btn-edit {
  padding: 5px 14px; border-radius: 6px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text-2); transition: all .12s; white-space: nowrap;
  font-family: inherit;
}
.btn-edit:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn-edit:disabled {
  background: var(--bg-3); color: var(--text-3);
  border-color: var(--border); cursor: not-allowed; opacity: 0.6;
}
.btn-edit-mgr {
  padding: 5px 14px; border-radius: 6px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--orange-bdr); background: var(--orange-bg);
  color: var(--orange); transition: all .12s; white-space: nowrap;
  font-family: inherit;
}
.btn-edit-mgr:hover { background: #fed7aa; border-color: var(--orange); }

/* ─── 表格 ─── */
.table-wrap { overflow-x: auto; }
.data-table {
  width: 100%; border-collapse: collapse;
  background: var(--card); border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border);
}
.data-table th {
  padding: 10px 14px; background: var(--bg-2);
  font-size: 14px; font-weight: 600; color: var(--text-2);
  text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 13px 14px; font-size: 18px; color: var(--text);
  border-bottom: 1px solid var(--border-2);
  vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--bg-2); }
.num-col { text-align: right !important; font-variant-numeric: tabular-nums; }
.profit-col { font-weight: 700; }
.profit-pos { color: var(--green); }
.profit-neg { color: var(--red); }

/* ─── 狀態 Badge ─── */
.badge-done {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 100px;
  background: var(--green-bg); color: var(--green);
  border: 1px solid var(--green-bdr);
  font-size: 14px; font-weight: 500; white-space: nowrap;
}
.badge-done::before { content: '●'; font-size: 8px; }

.badge-pending {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 100px;
  background: var(--yellow-bg); color: var(--yellow);
  border: 1px solid var(--yellow-bdr);
  font-size: 14px; font-weight: 500; white-space: nowrap;
}
.badge-pending::before { content: '●'; font-size: 8px; }

/* 第一層複合燈號 */
.badge-mixed {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; white-space: nowrap;
}
.badge-mixed .done-part {
  display: inline-flex; align-items: center; gap: 3px;
  color: var(--green); font-weight: 600;
}
.badge-mixed .pending-part {
  display: inline-flex; align-items: center; gap: 3px;
  color: var(--yellow); font-weight: 600;
}
.badge-mixed .dot { font-size: 8px; }

/* ─── 層切換 ─── */
.layer { display: none; }
.layer.layer-active { display: block; }

/* ─── 空狀態 ─── */
.empty-state {
  padding: 48px; text-align: center;
  color: var(--text-3); font-size: 16px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; margin-top: 4px;
}

/* ─── 第三層合計列 ─── */
.l3-summary {
  display: flex; gap: 32px; flex-wrap: wrap;
  padding: 14px 16px; background: var(--bg-2);
  border-top: 2px solid var(--border);
  border-radius: 0 0 10px 10px;
}
.l3-summary-item {
  display: flex; flex-direction: column; align-items: flex-end;
}
.l3-summary-label { font-size: 13px; color: var(--text-3); margin-bottom: 2px; }
.l3-summary-value { font-size: 18px; font-weight: 700; color: var(--text); }
.l3-summary-value.pos { color: var(--green); }
.l3-summary-value.neg { color: var(--red); }

/* ─── 服務編號 code ─── */
.svc-code {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 14px; background: var(--bg-3); border-radius: 4px;
  padding: 2px 6px; color: var(--text-2);
}

/* ─── 訂單編號 ─── */
.order-id {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 13px; color: var(--text-3);
}

/* ─── RWD ─── */
@media (max-width: 900px) {
  .data-table th, .data-table td { padding: 9px 10px; }
  .data-table td { font-size: 16px; }
  .hide-md { display: none; }
}
@media (max-width: 640px) {
  .toolbar { gap: 6px; }
  .date-input { width: 130px; font-size: 14px; }
  .hide-sm { display: none; }
}
  </style>
</head>

<div class="page">

  <!-- 麵包屑 -->

      </table>

  </section>

  <!-- ══════════════════════════════════════════
       第二層：各據點總攬
  ══════════════════════════════════════════ -->
  <section id="layer-2" class="layer">
    <div class="page-header">
      <div class="page-title">各據點總攬</div>
      <div class="page-sub" id="l2-subtitle"></div>
    </div>

      <span class="toolbar-label">日期</span>
      <input type="date" id="l2-date" class="date-input">

      </table>

      <button class="btn" id="l3-toggle-btn" style="margin-left:auto" onclick="toggleLayer3Status()">標記為完成</button>

  </section>

</div><!-- /.page -->

var MOCK_DATA = (function() {

  function dateStr(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    var y  = d.getFullYear();
    var m  = String(d.getMonth() + 1).padStart(2, '0');

        company:   r.company,

        brand:     r.brand || '',

        qty:       r.qty,
        unitPrice: r.price,
        cost:      r.cost,
        deduction: r.ded || 0,
        note:      r.note || ''
      };
    });
  }

  function makeSS(siteId, siteName, serviceCode, mealPeriod, status, subsidy, orders) {

      status: status, subsidy: subsidy,
      receivable: rec, receivableDeduction: recDed,
      payable: pay, payableDeduction: payDed,

/* ════════════════════════════════════════════════════
   狀態變數
════════════════════════════════════════════════════ */
var currentLayer = 1;
var currentDate  = null;
var currentSvcId = null;

/* ════════════════════════════════════════════════════
   工具函式
════════════════════════════════════════════════════ */
var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

function fmt(n) {
  return Number(n).toLocaleString('zh-TW');
}

function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T00:00:00');
  return dateStr + '（' + WEEKDAYS[d.getDay()] + '）';
}

/* ── 計算一筆 siteService 的動態欄位（profit 等） ── */
function calcSS(ss) {
  var ar = ss.receivable - ss.receivableDeduction;
  var ap = ss.payable - ss.payableDeduction;
  return {
    actualReceivable: ar,
    actualPayable: ap,
    profit: ar - ap
  };
}

/* ── 計算一天的第一層彙總（只計 done 的） ── */
function calcDaily(daily) {
  var done    = daily.siteServices.filter(function(s) { return s.status === 'done'; });
  var pending = daily.siteServices.filter(function(s) { return s.status === 'pending'; });
  var tRec    = done.reduce(function(s, ss) { return s + ss.receivable; }, 0);
  var tRecDed = done.reduce(function(s, ss) { return s + ss.receivableDeduction; }, 0);
  var tPay    = done.reduce(function(s, ss) { return s + ss.payable; }, 0);
  var tPayDed = done.reduce(function(s, ss) { return s + ss.payableDeduction; }, 0);
  var ar = tRec - tRecDed;
  var ap = tPay - tPayDed;
  return {
    totalRec: tRec, totalRecDed: tRecDed,
    totalPay: tPay, totalPayDed: tPayDed,
    actualRec: ar, actualPay: ap, profit: ar - ap,
    doneCount: done.length, pendingCount: pending.length
  };
}

/* ════════════════════════════════════════════════════
   層切換
════════════════════════════════════════════════════ */
function showLayer(n) {
  document.querySelectorAll('.layer').forEach(function(el) {
    el.classList.remove('layer-active');
  });
  document.getElementById('layer-' + n).classList.add('layer-active');
  currentLayer = n;
  updateBreadcrumb();
  window.scrollTo(0, 0);
}

function goLayer1() {
  showLayer(1);
}

function goLayer2(date) {
  if (!date) return;
  currentDate = date;
  document.getElementById('l2-date').value = date;
  document.getElementById('l2-subtitle').textContent = formatDateDisplay(date);
  renderLayer2(date);
  showLayer(2);
}

function goLayer2Back() {
  renderLayer2(currentDate);
  showLayer(2);
}

function goLayer3(svcId) {
  currentSvcId = svcId;
  renderLayer3(currentDate, svcId);
  showLayer(3);
}

/* ── 麵包屑更新 ── */
function updateBreadcrumb() {
  var sep2  = document.getElementById('bc-sep-2');
  var bc2   = document.getElementById('bc-layer2');
  var sep3  = document.getElementById('bc-sep-3');
  var bc3   = document.getElementById('bc-layer3');

  sep2.style.display = currentLayer >= 2 ? '' : 'none';
  bc2.style.display  = currentLayer >= 2 ? '' : 'none';
  sep3.style.display = currentLayer >= 3 ? '' : 'none';
  bc3.style.display  = currentLayer >= 3 ? '' : 'none';

  if (currentLayer >= 2) {
    bc2.textContent = formatDateDisplay(currentDate);
  }
  if (currentLayer >= 3) {
    var daily = MOCK_DATA.find(function(d) { return d.date === currentDate; });
    var ss = daily && daily.siteServices.find(function(s) { return s.serviceCode === currentSvcId; });
    bc3.textContent = ss ? ss.siteName + '・' + ss.mealPeriod : currentSvcId;
  }
}

/* ════════════════════════════════════════════════════
   第一層
════════════════════════════════════════════════════ */
function initDefaultDates() {
  var today = new Date();
  var yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  var start = new Date(yesterday);
  start.setDate(yesterday.getDate() - 5);
  document.getElementById('l1-date-from').value = formatDate(start);
  document.getElementById('l1-date-to').value   = formatDate(yesterday);
}

function queryLayer1() {
  var from = document.getElementById('l1-date-from').value;
  var to   = document.getElementById('l1-date-to').value;
  if (!from || !to) { alert('請選擇完整日期區間'); return; }
  if (from > to) { alert('起始日期不能晚於結束日期'); return; }

  var filtered = MOCK_DATA.filter(function(d) {
    return d.date >= from && d.date <= to;
  }).slice().sort(function(a, b) {
    return b.date.localeCompare(a.date);
  });

  renderLayer1Table(filtered);
}

function renderLayer1Table(rows) {
  var tbody = document.getElementById('l1-tbody');
  var empty = document.getElementById('l1-empty');

  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map(function(daily) {
    var t = calcDaily(daily);
    var d = new Date(daily.date + 'T00:00:00');
    var wd = '（' + WEEKDAYS[d.getDay()] + '）';
    var profCls = t.profit >= 0 ? 'profit-pos' : 'profit-neg';
    var isAllDone = t.pendingCount === 0;

    /* 狀態 badge */
    var statusHtml;
    if (t.pendingCount === 0 && t.doneCount === 0) {
      statusHtml = '<span class="badge-pending">無資料</span>';
    } else if (t.pendingCount === 0) {
      statusHtml = '<span class="badge-done">已完成</span>';
    } else if (t.doneCount === 0) {
      statusHtml = '<span class="badge-pending">未完成 ' + t.pendingCount + '</span>';
    } else {
      statusHtml = (
        '<span class="badge-mixed">' +
          '<span class="done-part"><span class="dot">●</span>' + t.doneCount + ' 完成</span>' +
          '<span class="pending-part"><span class="dot">●</span>' + t.pendingCount + ' 未完成</span>' +
        '</span>'
      );
    }

    var editBtn = isAllDone
      ? '<button class="btn-edit" disabled>編輯</button>'
      : '<button class="btn-edit" onclick="goLayer2(\'' + daily.date + '\')">編輯</button>';

    return (
      '<tr>' +
        '<td>' + daily.date + '</td>' +
        '<td>' + wd + '</td>' +
        '<td class="num-col">' + fmt(t.totalRec) + '</td>' +
        '<td class="num-col hide-md">' + fmt(t.totalRecDed) + '</td>' +
        '<td class="num-col">' + fmt(t.totalPay) + '</td>' +
        '<td class="num-col hide-md">' + fmt(t.totalPayDed) + '</td>' +
        '<td class="num-col">' + fmt(t.actualRec) + '</td>' +
        '<td class="num-col">' + fmt(t.actualPay) + '</td>' +
        '<td class="num-col profit-col ' + profCls + '">' + fmt(t.profit) + '</td>' +
        '<td>' + statusHtml + '</td>' +
        '<td>' + editBtn + '</td>' +
      '</tr>'
    );
  }).join('');
}

/* ════════════════════════════════════════════════════
   第二層
════════════════════════════════════════════════════ */
function queryLayer2() {
  var date = document.getElementById('l2-date').value;
  if (!date) return;
  currentDate = date;
  document.getElementById('l2-subtitle').textContent = formatDateDisplay(date);
  renderLayer2(date);
}

var MEAL_ORDER = { '早餐': 0, '午餐': 1, '下午茶': 2, '晚餐': 3, '宵夜': 4, '特殊訂餐': 5 };

function renderLayer2(date) {
  var daily = MOCK_DATA.find(function(d) { return d.date === date; });
  var tbody = document.getElementById('l2-tbody');
  var empty = document.getElementById('l2-empty');

  if (!daily || daily.siteServices.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  var sorted = daily.siteServices.slice().sort(function(a, b) {
    if (a.siteId !== b.siteId) return a.siteId.localeCompare(b.siteId);
    var ma = MEAL_ORDER[a.mealPeriod] !== undefined ? MEAL_ORDER[a.mealPeriod] : 9;
    var mb = MEAL_ORDER[b.mealPeriod] !== undefined ? MEAL_ORDER[b.mealPeriod] : 9;
    return ma - mb;
  });

  tbody.innerHTML = sorted.map(function(ss) {
    var c = calcSS(ss);
    var isDone = ss.status === 'done';
    var profCls = c.profit >= 0 ? 'profit-pos' : 'profit-neg';
    var badge = isDone
      ? '<span class="badge-done">完成</span>'
      : '<span class="badge-pending">未完成</span>';
    var editBtn = isDone
      ? '<button class="btn-edit" disabled>編輯</button> <button class="btn-edit-mgr" onclick="goLayer3(\'' + ss.serviceCode + '\')">主管編輯</button>'
      : '<button class="btn-edit" onclick="goLayer3(\'' + ss.serviceCode + '\')">編輯</button>';

    return (
      '<tr>' +
        '<td><span class="svc-code">' + ss.serviceCode + '</span></td>' +
        '<td class="num-col">' + fmt(ss.receivable) + '</td>' +
        '<td class="num-col hide-md">' + fmt(ss.receivableDeduction) + '</td>' +
        '<td class="num-col">' + fmt(ss.payable) + '</td>' +
        '<td class="num-col hide-md">' + fmt(ss.payableDeduction) + '</td>' +
        '<td class="num-col">' + fmt(c.actualReceivable) + '</td>' +
        '<td class="num-col">' + fmt(c.actualPayable) + '</td>' +
        '<td class="num-col profit-col ' + profCls + '">' + fmt(c.profit) + '</td>' +
        '<td>' + badge + '</td>' +
        '<td>' + editBtn + '</td>' +
      '</tr>'
    );
  }).join('');
}

/* ════════════════════════════════════════════════════
   第三層
════════════════════════════════════════════════════ */
function renderLayer3(date, svcId) {
  var daily = MOCK_DATA.find(function(d) { return d.date === date; });
  var ss = daily && daily.siteServices.find(function(s) { return s.serviceCode === svcId; });
  var toggleBtn = document.getElementById('l3-toggle-btn');

  document.getElementById('l3-subtitle').textContent = ss
    ? ss.siteName + '　' + ss.mealPeriod + '　' + ss.serviceCode + '　' + formatDateDisplay(date)
    : '';

  if (ss) {
    toggleBtn.textContent = ss.status === 'done' ? '取消完成' : '標記為完成';
    toggleBtn.style.display = '';
  } else {
    toggleBtn.style.display = 'none';
  }

  var tbody  = document.getElementById('l3-tbody');
  var empty  = document.getElementById('l3-empty');
  var orders = ss ? ss.orders : [];

  if (orders.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  var subsidy = (ss && ss.subsidy) ? ss.subsidy : 0;

  tbody.innerHTML = orders.map(function(o) {
    var subtotal = o.qty * o.unitPrice;
    var subsidyCell = subsidy > 0 ? fmt(subsidy) : '—';
    return (
      '<tr>' +
        '<td><span class="order-id">' + o.orderId + '</span></td>' +
        '<td>' + (o.brand || '—') + '</td>' +
        '<td>' + o.itemName + '</td>' +
        '<td class="num-col">' + o.qty + '</td>' +
        '<td class="num-col">' + fmt(o.unitPrice) + '</td>' +
        '<td class="num-col">' + subsidyCell + '</td>' +
        '<td class="num-col">' + fmt(subtotal) + '</td>' +
      '</tr>'
    );
  }).join('');
}

/* ── 標記 / 取消完成（Demo 互動） ── */
function toggleLayer3Status() {
  var daily = MOCK_DATA.find(function(d) { return d.date === currentDate; });
  var ss = daily && daily.siteServices.find(function(s) { return s.serviceCode === currentSvcId; });
  if (!ss) return;
  ss.status = ss.status === 'done' ? 'pending' : 'done';
  renderLayer3(currentDate, currentSvcId);
}
