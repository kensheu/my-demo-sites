<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供餐價格設定 — 內部後台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #f3f2ef;
  --card:        #ffffff;
  --bg-2:        #fafaf9;
  --bg-3:        #eeece9;
  --border:      #e5e5e4;
  --border-2:    #efefed;
  --text:        #1c1b1a;
  --text-2:      #57534e;
  --text-3:      #78716c;
  --blue:        #1d4ed8;
  --blue-bg:     #eff6ff;
  --blue-border: #bfdbfe;
  --blue-text:   #1e40af;
  --green:       #15803d;
  --green-bg:    #f0fdf4;
  --green-bdr:   #bbf7d0;
  --orange:      #c2410c;
  --orange-bg:   #fff7ed;
  --orange-bdr:  #fed7aa;
  --red:         #b91c1c;
  --red-bg:      #fef2f2;
  --red-bdr:     #fecaca;
  --purple:      #7c3aed;
  --purple-bg:   #f5f3ff;
  --purple-bdr:  #ddd6fe;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
               "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  font-size: 20px;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}

.page { max-width: 1100px; margin: 0 auto; padding: 12px 32px 80px; }
.page-header { margin-bottom: 20px; }
.page-title  { font-size: 24px; font-weight: 600; }
.page-sub    { font-size: 18px; color: var(--text-3); margin-top: 3px; }

/* ── 按鈕 ── */
.btn {
  padding: 6px 14px; border-radius: 6px; font-size: 16px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: var(--card);
  color: var(--text-2); font-family: inherit; transition: all .12s;
}
.btn:hover { background: var(--bg-3); }
.btn-sm {
  padding: 3px 10px; font-size: 14px; border-radius: 5px;
  cursor: pointer; border: 1px solid var(--border); background: var(--card);
  color: var(--text-2); font-family: inherit; transition: all .12s; white-space: nowrap;
}
.btn-sm:hover { background: var(--bg-3); }
.btn-primary {
  background: var(--blue); color: #fff; border-color: var(--blue);
}
.btn-primary:hover { opacity: .88; background: var(--blue); }

/* ── 步驟卡片 ── */
.step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
}
.step-card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
}
.step-badge {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--blue); color: #fff;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.step-card-title { font-size: 17px; font-weight: 600; color: var(--text); }
.step-card-summary {
  margin-left: auto;
  font-size: 13px;
  color: var(--blue-text);
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  border-radius: 100px;
  padding: 2px 10px;
  white-space: nowrap;
}
.step-card-body { padding: 18px 20px; }

/* ── 篩選列（Step 1 & 2） ── */
.filter-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.filter-row-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.filter-col { display: flex; flex-direction: column; gap: 5px; }
.filter-label { font-size: 15px; font-weight: 500; color: var(--text-2); }

/* ── 自訂多選下拉 ── */
.ms-wrap { position: relative; }
.ms-trigger {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
  padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-2); cursor: pointer;
  font-size: 16px; font-family: inherit; color: var(--text);
  transition: border-color .12s; user-select: none; min-height: 36px;
}
.ms-trigger:hover, .ms-wrap.open .ms-trigger { border-color: var(--blue); background: var(--card); }
.ms-trigger-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-trigger-text.placeholder { color: var(--text-3); }
.ms-arrow { font-size: 11px; color: var(--text-3); flex-shrink: 0; transition: transform .15s; }
.ms-wrap.open .ms-arrow { transform: rotate(180deg); }

.ms-panel {
  display: none;
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.1);
  z-index: 200; overflow: hidden;
}
.ms-wrap.open .ms-panel { display: block; }

.ms-search-wrap {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border-2);
}
.ms-search {
  width: 100%; padding: 5px 8px;
  border: 1px solid var(--border); border-radius: 5px;
  font-size: 14px; font-family: inherit; color: var(--text);
  background: var(--bg-2); outline: none;
}
.ms-search:focus { border-color: var(--blue); background: var(--card); }

.ms-actions {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border-2);
}
.ms-action-btn {
  flex: 1; padding: 6px 0; font-size: 14px; font-family: inherit;
  background: none; border: none; cursor: pointer; color: var(--blue-text);
  transition: background .1s;
}
.ms-action-btn:hover { background: var(--blue-bg); }
.ms-action-btn + .ms-action-btn { border-left: 1px solid var(--border-2); }

.ms-list { max-height: 200px; overflow-y: auto; }
.ms-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; font-size: 15px; color: var(--text-2);
  cursor: pointer; transition: background .1s; border-bottom: 1px solid var(--border-2);
}
.ms-option:last-child { border-bottom: none; }
.ms-option:hover { background: var(--bg-2); }
.ms-option.selected { background: var(--blue-bg); color: var(--blue-text); }
.ms-option-check {
  width: 15px; height: 15px; flex-shrink: 0;
  border: 1.5px solid var(--border); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: transparent;
  background: var(--card);
}
.ms-option.selected .ms-option-check {
  background: var(--blue); border-color: var(--blue); color: #fff;
}
.ms-option-group-label {
  font-size: 12px; font-weight: 600; color: var(--text-3);
  letter-spacing: .04em; text-transform: uppercase;
}
.ms-option-sub { color: var(--text-3); font-size: 13px; }
.ms-empty { padding: 10px 12px; font-size: 15px; color: var(--text-3); font-style: italic; }

/* ── Empty hint ── */
.empty-hint {
  font-size: 14px;
  color: var(--text-3);
  font-style: italic;
  padding: 6px 0;
}

/* ── 模式切換 ── */
.mode-toggle-row {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.mode-radio-label {
  flex: 1;
  cursor: pointer;
}
.mode-radio-label input[type="radio"] { display: none; }
.mode-radio-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  transition: all .12s;
  height: 100%;
}
.mode-radio-label:hover .mode-radio-card { border-color: var(--blue-border); }
.mode-radio-label input:checked + .mode-radio-card {
  border-color: var(--blue);
  background: var(--blue-bg);
}
.mode-radio-icon { font-size: 20px; font-weight: 700; color: var(--text-3); margin-bottom: 2px; }
.mode-radio-title { font-size: 16px; font-weight: 600; color: var(--text); }
.mode-radio-desc  { font-size: 14px; color: var(--text-3); }
.mode-radio-label input:checked + .mode-radio-card .mode-radio-icon,
.mode-radio-label input:checked + .mode-radio-card .mode-radio-title { color: var(--blue); }

/* ── 模式表單 ── */
.mode-form { padding-top: 4px; }
.form-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px 20px;
}
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 15px; font-weight: 500; color: var(--text-2); }
.form-input {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 16px; font-family: inherit; color: var(--text); background: var(--bg-2);
  outline: none; transition: border-color .12s; width: 100%;
}
.form-input:focus { border-color: var(--blue); background: var(--card); }
.form-hint { font-size: 14px; color: var(--text-3); margin-top: 2px; }
.required { color: var(--red); }
.optional-tag {
  font-size: 12px; color: var(--text-3); font-weight: 400;
  padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px;
  margin-left: 4px;
}

/* ── 輸入框 + 單位 ── */
.input-with-unit {
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-with-unit .form-input { flex: 1; }
.input-unit {
  font-size: 15px;
  color: var(--text-2);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── 折後價預覽 ── */
.discount-preview {
  padding: 8px 12px;
  background: var(--green-bg);
  border: 1px solid var(--green-bdr);
  border-radius: 6px;
  font-size: 14px;
  color: var(--green);
  margin-top: 10px;
}

/* ── 加價模式 ── */
.markup-section {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.markup-section:last-child { margin-bottom: 0; }
.markup-options-row { display: flex; gap: 0; }
.markup-col { flex: 1; padding: 0 16px; border-right: 1px solid var(--border-2); }
.markup-col:first-child { padding-left: 0; }
.markup-col:last-child  { border-right: none; }
.markup-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.checkbox-option-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  color: var(--text-2);
  cursor: pointer;
  padding: 3px 0;
  margin-bottom: 4px;
}
.checkbox-option-row input[type="checkbox"],
.checkbox-option-row input[type="radio"] {
  width: 16px; height: 16px;
  accent-color: var(--blue);
  cursor: pointer; flex-shrink: 0;
}

.radio-stack { display: flex; flex-direction: column; gap: 6px; }
.radio-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 16px;
  color: var(--text-2);
  cursor: pointer;
  padding: 3px 0;
}
.radio-row input[type="radio"] {
  width: 16px; height: 16px;
  accent-color: var(--blue);
  cursor: pointer; flex-shrink: 0; margin-top: 2px;
}

.sub-option-wrap {
  margin-left: 24px;
  margin-top: 8px;
  margin-bottom: 4px;
}

/* ── 單品加價列表 ── */
.per-item-list { display: flex; flex-direction: column; gap: 6px; }
.per-item-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--border-2);
  border-radius: 6px;
}
.per-item-name {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.per-item-price {
  font-size: 13px;
  color: var(--text-3);
  white-space: nowrap;
}
.per-item-input {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg-2);
  outline: none; transition: border-color .12s; width: 80px; text-align: right;
}
.per-item-input:focus { border-color: var(--blue); background: var(--card); }

/* ── 送出列 ── */
.submit-bar {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 8px 0 8px;
}

/* ── 規則列表 ── */
.rules-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; margin-top: 4px;
}
.rules-title { font-size: 18px; font-weight: 600; color: var(--text); }
.rules-count {
  font-size: 13px; color: var(--text-3);
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 100px; padding: 1px 10px;
}
.rule-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 14px;
}
.rule-card-head { display: none; }
.rule-site-badges { display: flex; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
.rule-site-badge {
  font-size: 13px; font-weight: 500;
  background: var(--blue-bg); color: var(--blue-text);
  border: 1px solid var(--blue-border);
  border-radius: 6px; padding: 2px 9px; white-space: nowrap;
}
.rule-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
.rule-mode-badge {
  display: inline-block; font-size: 13px; font-weight: 600;
  padding: 2px 10px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
}
.rule-mode-discount {
  background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-bdr);
}
.rule-mode-markup {
  background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-bdr);
}
.rule-card-body {
  display: flex; flex: 1; gap: 20px; min-width: 0;
}
.rule-field { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rule-field-label { font-size: 11px; color: var(--text-3); }
.rule-field-value { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rule-card-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.rules-filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 14px;
}
.rules-filter-bar .ms-wrap { min-width: 200px; }
.filter-btn-group { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.filter-btn {
  padding: 5px 14px; font-size: 14px; font-family: inherit;
  background: var(--card); color: var(--text-2);
  border: none; border-right: 1px solid var(--border);
  cursor: pointer; transition: background .12s, color .12s;
  white-space: nowrap;
}
.filter-btn:last-child { border-right: none; }
.filter-btn:hover { background: var(--bg-2); }
.filter-btn.active { background: var(--blue); color: #fff; }
.rules-filter-empty { color: var(--text-3); font-size: 14px; padding: 20px 0; text-align: center; }
.btn-del {
  padding: 4px 12px; font-size: 14px; border-radius: 5px;
  background: none; border: 1px solid var(--red-bdr); color: var(--red);
  cursor: pointer; font-family: inherit; transition: all .12s;
}
.btn-del:hover { background: var(--red-bg); }
.rule-toggle-wrap {
  display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2);
}
.toggle-switch {
  position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0;
}
.toggle-switch input { display: none; }
.toggle-track {
  position: absolute; inset: 0; border-radius: 22px;
  background: var(--border); cursor: pointer; transition: background .2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--blue); }
.toggle-knob {
  position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .2s; pointer-events: none;
}
.toggle-switch input:checked + .toggle-track .toggle-knob { transform: translateX(18px); }
.toggle-label-text { font-size: 14px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1c1b1a; color: #fff;
  padding: 10px 22px; border-radius: 8px;
  font-size: 16px; font-weight: 500;
  pointer-events: none; opacity: 0;
  transition: opacity .2s, transform .2s;
  z-index: 9999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }

/* ── RWD ── */
@media (max-width: 768px) {
  .page { padding: 10px 12px 80px; }
  .mode-toggle-row { flex-direction: column; }
  .form-grid-2 { grid-template-columns: 1fr; }
  .filter-row { grid-template-columns: 1fr; }
  .filter-row-2 { grid-template-columns: 1fr; }
  .step-card-summary { display: none; }
  .per-item-row { flex-wrap: wrap; }
}
</style>

<body>
<script src="shared-nav.js"></script>

<div class="page">

  <div class="page-header">
    <div class="page-title">供餐價格設定</div>
    <div class="page-sub">菜單管理 ・ 設定各餐廳分店的打折或加價販售規則</div>
  </div>

  <!-- Step 1：據點 -->
  <div class="step-card">
    <div class="step-card-head">
      <div class="step-badge">1</div>
      <div class="step-card-title">選擇套用據點</div>
      <span class="step-card-summary" id="step1-summary"></span>
    </div>
    <div class="step-card-body">
      <div class="filter-row-2">
        <div class="filter-col">
          <div class="filter-label">公司</div>
          <div class="ms-wrap" id="ms-company">
            <div class="ms-trigger" onclick="msToggle('ms-company')">
              <span class="ms-trigger-text placeholder" id="ms-company-label">請選擇公司</span>
              <span class="ms-arrow">▼</span>
            </div>
            <div class="ms-panel">
              <div class="ms-search-wrap">
                <input class="ms-search" type="text" placeholder="搜尋公司…" oninput="msFilter('ms-company',this.value)">
              </div>
              <div class="ms-actions">
                <button class="ms-action-btn" onclick="msSelectAll('ms-company');event.stopPropagation()">全選</button>
                <button class="ms-action-btn" onclick="msClearAll('ms-company');event.stopPropagation()">清除</button>
              </div>
              <div class="ms-list" id="ms-company-list"></div>
            </div>
          </div>
        </div>
        <div class="filter-col">
          <div class="filter-label">廠區 / 據點</div>
          <div class="ms-wrap" id="ms-site">
            <div class="ms-trigger" onclick="msToggle('ms-site')">
              <span class="ms-trigger-text placeholder" id="ms-site-label">請先選擇公司</span>
              <span class="ms-arrow">▼</span>
            </div>
            <div class="ms-panel">
              <div class="ms-search-wrap">
                <input class="ms-search" type="text" placeholder="搜尋據點…" oninput="msFilter('ms-site',this.value)">
              </div>
              <div class="ms-actions">
                <button class="ms-action-btn" onclick="msSelectAll('ms-site');event.stopPropagation()">全選</button>
                <button class="ms-action-btn" onclick="msClearAll('ms-site');event.stopPropagation()">清除</button>
              </div>
              <div class="ms-list" id="ms-site-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2：餐廳與分店 -->
  <div class="step-card">
    <div class="step-card-head">
      <div class="step-badge">2</div>
      <div class="step-card-title">選擇餐廳與分店</div>
      <span class="step-card-summary" id="step2-summary"></span>
    </div>
    <div class="step-card-body">
      <div class="filter-row">

        <!-- 區域 -->
        <div class="filter-col">
          <div class="filter-label">區域</div>
          <div class="ms-wrap" id="ms-region">
            <div class="ms-trigger" onclick="msToggle('ms-region')">
              <span class="ms-trigger-text placeholder" id="ms-region-label">請選擇區域</span>
              <span class="ms-arrow">▼</span>
            </div>
            <div class="ms-panel">
              <div class="ms-search-wrap">
                <input class="ms-search" type="text" placeholder="搜尋區域…" oninput="msFilter('ms-region',this.value)">
              </div>
              <div class="ms-actions">
                <button class="ms-action-btn" onclick="msSelectAll('ms-region');event.stopPropagation()">全選</button>
                <button class="ms-action-btn" onclick="msClearAll('ms-region');event.stopPropagation()">清除</button>
              </div>
              <div class="ms-list" id="ms-region-list"></div>
            </div>
          </div>
        </div>

        <!-- 餐廳 -->
        <div class="filter-col">
          <div class="filter-label">餐廳</div>
          <div class="ms-wrap" id="ms-rest">
            <div class="ms-trigger" onclick="msToggle('ms-rest')">
              <span class="ms-trigger-text placeholder" id="ms-rest-label">請先選擇區域</span>
              <span class="ms-arrow">▼</span>
            </div>
            <div class="ms-panel">
              <div class="ms-search-wrap">

      <!-- 模式 A 表單 -->

        <div class="form-grid-2">
          <div class="form-row">
            <label class="form-label">起始日期 <span class="required">*</span></label>
            <input type="date" id="discount-start" class="form-input" oninput="onDiscountChange()">
          </div>
          <div class="form-row">

          </div>

            <label class="form-label">折扣%數 <span class="required">*</span></label>
            <div class="input-with-unit">

                     placeholder="例：85" oninput="onDiscountChange()">

            <div class="form-hint">折後價 ＝ 店內價 × 輸入值 ÷ 100　例：輸入 85 → 店內價 × 85%</div>

            <button class="ms-action-btn" onclick="msClearAll('ms-filter-site');event.stopPropagation()">清除</button>

        <button class="filter-btn" onclick="setFilterMode('markup',this)">加價販售</button>
        <button class="filter-btn" onclick="setFilterMode('discount',this)">折價販售</button>
      </div>
      <!-- 篩選：啟用狀態 -->
      <div class="filter-btn-group">
        <button class="filter-btn active" onclick="setFilterEnabled('',this)">所有狀態</button>
        <button class="filter-btn" onclick="setFilterEnabled('1',this)">啟用中</button>
        <button class="filter-btn" onclick="setFilterEnabled('0',this)">已停用</button>

    <div id="rules-list"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ── 假資料 ── */
const REGIONS = ['台北', '新竹', '台南', '高雄'];

const restaurants = [
  { id:'R001', name:'東方廚房', region:'台北',
    branches:[{id:'R001-B1',name:'中山店'},{id:'R001-B2',name:'信義店'}],
    items:[{id:'R001-I1',name:'招牌燒肉飯',price:110},{id:'R001-I2',name:'雞腿便當',price:100},{id:'R001-I3',name:'排骨便當',price:95}] },
  { id:'R002', name:'台北早點', region:'台北',
    branches:[{id:'R002-B1',name:'南港店'}],
    items:[{id:'R002-I1',name:'蛋餅',price:45},{id:'R002-I2',name:'漢堡',price:60},{id:'R002-I3',name:'饅頭夾蛋',price:40},{id:'R002-I4',name:'豆漿',price:25}] },
  { id:'R003', name:'老饕麵館', region:'台北',
    branches:[],
    items:[{id:'R003-I1',name:'牛肉麵',price:130},{id:'R003-I2',name:'乾麵',price:80},{id:'R003-I3',name:'餛飩湯',price:70}] },
  { id:'R004', name:'OO 雞飯專門店', region:'新竹',

    items:[{id:'R004-I1',name:'雞腿便當',price:100},{id:'R004-I2',name:'半雞便當',price:90},{id:'R004-I3',name:'雞絲飯',price:75}] },
  { id:'R005', name:'XX 早餐店', region:'新竹',
    branches:[{id:'R005-B1',name:'竹科店'}],
    items:[{id:'R005-I1',name:'培根蛋吐司',price:55},{id:'R005-I2',name:'薯餅蛋餅',price:50},{id:'R005-I3',name:'鐵板麵',price:65},{id:'R005-I4',name:'奶茶',price:30}] },
  { id:'R006', name:'阿成便當', region:'新竹',
    branches:[],
    items:[{id:'R006-I1',name:'控肉便當',price:85},{id:'R006-I2',name:'素食便當',price:75},{id:'R006-I3',name:'三寶便當',price:95}] },
  { id:'R007', name:'府城米食', region:'台南',
    branches:[{id:'R007-B1',name:'中西區店'},{id:'R007-B2',name:'東區店'}],
    items:[{id:'R007-I1',name:'滷肉飯',price:40},{id:'R007-I2',name:'虱目魚湯',price:65},{id:'R007-I3',name:'碗粿',price:35}] },
  { id:'R008', name:'南都小吃', region:'台南',
    branches:[],
    items:[{id:'R008-I1',name:'擔仔麵',price:60},{id:'R008-I2',name:'肉燥飯',price:35},{id:'R008-I3',name:'炒米粉',price:55},{id:'R008-I4',name:'貢丸湯',price:40}] },
  { id:'R009', name:'港都海鮮', region:'高雄',
    branches:[{id:'R009-B1',name:'鼓山店'}],
    items:[{id:'R009-I1',name:'海鮮炒飯',price:120},{id:'R009-I2',name:'蝦仁炒蛋',price:90},{id:'R009-I3',name:'魚排便當',price:100}] },
  { id:'R010', name:'左營麵食', region:'高雄',
    branches:[],
    items:[{id:'R010-I1',name:'乾麵',price:55},{id:'R010-I2',name:'湯麵',price:60},{id:'R010-I3',name:'炸醬麵',price:65},{id:'R010-I4',name:'小菜',price:25}] },
];

const COMPANIES = [
  { id:'corp-a', name:'台灣科技股份有限公司' },
  { id:'corp-b', name:'聯合製造有限公司' },
  { id:'corp-c', name:'南部工業股份有限公司' },
];

const SITES = [
  { id:'tp-a', name:'台北 A 廠', region:'台北', company:'corp-a' },
  { id:'tp-b', name:'台北 B 廠', region:'台北', company:'corp-b' },
  { id:'hc-a', name:'新竹 A 廠', region:'新竹', company:'corp-a' },
  { id:'hc-b', name:'新竹 B 廠', region:'新竹', company:'corp-b' },
  { id:'tn',   name:'台南廠',    region:'台南', company:'corp-c' },
  { id:'kh',   name:'高雄廠',    region:'高雄', company:'corp-c' },
];

/* ── 狀態 ── */
const state = {
  selectedCompanies:   new Set(),
  selectedRegions:     new Set(),
  selectedRestaurants: new Set(),
  selectedBranches:    new Set(),
  selectedSites:       new Set(),
};

/* ── 工具函式 ── */
function getBranchKeys(rest) {
  if (rest.branches.length === 0) return [rest.id + ':__main__'];
  return rest.branches.map(function(b) { return rest.id + ':' + b.id; });
}

function getBranchLabel(rest, key) {
  if (key.endsWith(':__main__')) return '主店';
  var bId = key.split(':')[1];
  var b = rest.branches.find(function(x) { return x.id === bId; });
  return b ? b.name : bId;
}

function getFilteredRestaurants() {
  if (state.selectedRegions.size === 0) return [];
  return restaurants.filter(function(r) { return state.selectedRegions.has(r.region); });
}

function getAllBranchKeys() {
  var keys = [];
  restaurants.filter(function(r) { return state.selectedRestaurants.has(r.id); })
    .forEach(function(r) {
      getBranchKeys(r).forEach(function(k) { keys.push(k); });
    });
  return keys;
}

function getFirstSelectedItem() {
  for (var i = 0; i < restaurants.length; i++) {
    var r = restaurants[i];
    if (state.selectedRestaurants.has(r.id) && r.items.length > 0) {
      return r.items[0];
    }
  }
  return null;
}

/* ════════════════════════════════════════
   多選下拉通用邏輯
   ════════════════════════════════════════ */

/* 開關面板 */
function msToggle(id) {
  var wrap = document.getElementById(id);
  var isOpen = wrap.classList.contains('open');
  // 關閉其他下拉時清除其搜尋框
  document.querySelectorAll('.ms-wrap.open').forEach(function(el) {
    var s = el.querySelector('.ms-search');
    if (s) { s.value = ''; msFilter(el.id, ''); }
    el.classList.remove('open');
  });
  if (!isOpen) wrap.classList.add('open');
}

/* 點擊外部關閉（panel 內的點擊不關閉） */
document.addEventListener('click', function(e) {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-wrap.open').forEach(function(el) { el.classList.remove('open'); });
  }
});


/* 渲染觸發器文字（已選摘要）*/
function msUpdateLabel(id, selectedSet, allItems, labelEl, placeholder) {
  var el = document.getElementById(labelEl);
  var count = selectedSet.size;
  if (count === 0) {
    el.textContent = placeholder;
    el.classList.add('placeholder');
  } else if (count === allItems.length) {
    el.textContent = '全部（' + count + '）';
    el.classList.remove('placeholder');
  } else {
    el.textContent = '已選 ' + count + ' 項';
    el.classList.remove('placeholder');
  }
}

/* ── 搜尋過濾 ── */
function msFilter(id, kw) {
  kw = kw.trim();
  if (id === 'ms-company') renderCompanyDropdown(kw);
  else if (id === 'ms-region') renderRegionDropdown(kw);
  else if (id === 'ms-rest') renderRestDropdown(kw);
  else if (id === 'ms-branch') renderBranchDropdown(kw);
  else if (id === 'ms-site') renderSiteDropdown(kw);
  else if (id === 'ms-filter-company') renderFilterCompanyDropdown(kw);
  else if (id === 'ms-filter-site') renderFilterSiteDropdown(kw);
}

/* ── 區域下拉 ── */
function renderRegionDropdown(kw) {
  kw = (kw || '').trim();
  var list = document.getElementById('ms-region-list');
  var filtered = kw ? REGIONS.filter(function(n) { return n.includes(kw); }) : REGIONS;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="ms-empty">無符合結果</div>';
    msUpdateLabel('ms-region', state.selectedRegions, REGIONS, 'ms-region-label', '請選擇區域');
    return;
  }
  list.innerHTML = filtered.map(function(name) {
    var sel = state.selectedRegions.has(name);
    return '<div class="ms-option' + (sel ? ' selected' : '') + '" onclick="toggleRegion(\'' + name + '\')">'
      + '<span class="ms-option-check">✓</span>'
      + name + '</div>';
  }).join('');
  msUpdateLabel('ms-region', state.selectedRegions, REGIONS, 'ms-region-label', '請選擇區域');
}

function toggleRegion(name) {
  if (state.selectedRegions.has(name)) {
    state.selectedRegions.delete(name);
    restaurants.filter(function(r) { return r.region === name; }).forEach(function(r) {
      state.selectedRestaurants.delete(r.id);
      getBranchKeys(r).forEach(function(k) { state.selectedBranches.delete(k); });
    });
  } else {
    state.selectedRegions.add(name);
  }
  renderRegionDropdown();
  renderRestDropdown();
  renderBranchDropdown();
  updateStep2Summary();
}

function msSelectAll(id) {
  if (id === 'ms-filter-company') {
    COMPANIES.forEach(function(c) { filterState.companies.add(c.id); });
    renderFilterCompanyDropdown(); renderFilterSiteDropdown(); renderRulesList();
  } else if (id === 'ms-filter-site') {
    getFilterSites().forEach(function(s) { filterState.sites.add(s.id); });
    renderFilterSiteDropdown(); renderRulesList();
  } else if (id === 'ms-company') {
    COMPANIES.forEach(function(c) { state.selectedCompanies.add(c.id); });
    renderCompanyDropdown(); renderSiteDropdown(); updateStep1Summary();
  } else if (id === 'ms-region') {
    REGIONS.forEach(function(n) { state.selectedRegions.add(n); });
    renderRegionDropdown(); renderRestDropdown(); renderBranchDropdown(); updateStep2Summary();
  } else if (id === 'ms-rest') {
    getFilteredRestaurants().forEach(function(r) { state.selectedRestaurants.add(r.id); });
    renderRestDropdown(); renderBranchDropdown(); updateStep2Summary();
    maybeRefreshPerItem();
  } else if (id === 'ms-branch') {
    getAllBranchKeys().forEach(function(k) { state.selectedBranches.add(k); });
    renderBranchDropdown(); updateStep2Summary();
  } else if (id === 'ms-site') {
    getFilteredSites().forEach(function(s) { state.selectedSites.add(s.id); });
    renderSiteDropdown(); updateStep1Summary();
  }
}

function msClearAll(id) {
  if (id === 'ms-filter-company') {
    filterState.companies.clear(); filterState.sites.clear();
    renderFilterCompanyDropdown(); renderFilterSiteDropdown(); renderRulesList();
  } else if (id === 'ms-filter-site') {
    getFilterSites().forEach(function(s) { filterState.sites.delete(s.id); });
    renderFilterSiteDropdown(); renderRulesList();
  } else if (id === 'ms-company') {
    state.selectedCompanies.clear();
    getFilteredSites().forEach(function(s) { state.selectedSites.delete(s.id); });
    renderCompanyDropdown(); renderSiteDropdown(); updateStep1Summary();
  } else if (id === 'ms-region') {
    state.selectedRegions.clear(); state.selectedRestaurants.clear(); state.selectedBranches.clear();
    renderRegionDropdown(); renderRestDropdown(); renderBranchDropdown(); updateStep2Summary();
    maybeRefreshPerItem();
  } else if (id === 'ms-rest') {
    getFilteredRestaurants().forEach(function(r) {
      state.selectedRestaurants.delete(r.id);
      getBranchKeys(r).forEach(function(k) { state.selectedBranches.delete(k); });
    });
    renderRestDropdown(); renderBranchDropdown(); updateStep2Summary();
    maybeRefreshPerItem();
  } else if (id === 'ms-branch') {
    getAllBranchKeys().forEach(function(k) { state.selectedBranches.delete(k); });
    renderBranchDropdown(); updateStep2Summary();
  } else if (id === 'ms-site') {
    getFilteredSites().forEach(function(s) { state.selectedSites.delete(s.id); });
    renderSiteDropdown(); updateStep1Summary();
  }
}

/* ── 餐廳下拉 ── */
function renderRestDropdown(kw) {
  kw = (kw || '').trim();
  var list = document.getElementById('ms-rest-list');
  var base = getFilteredRestaurants();
  if (state.selectedRegions.size === 0) {
    list.innerHTML = '<div class="ms-empty">請先選擇區域</div>';
    msUpdateLabel('ms-rest', new Set(), [], 'ms-rest-label', '請先選擇區域');
    return;
  }
  if (base.length === 0) {
    list.innerHTML = '<div class="ms-empty">此區域尚無餐廳</div>';
    msUpdateLabel('ms-rest', new Set(), [], 'ms-rest-label', '此區域尚無餐廳');
    return;
  }
  var filtered = kw ? base.filter(function(r) { return r.name.includes(kw); }) : base;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="ms-empty">無符合結果</div>';
    msUpdateLabel('ms-rest', state.selectedRestaurants, base.map(function(r){return r.id;}), 'ms-rest-label', '請選擇餐廳');
    return;
  }
  list.innerHTML = filtered.map(function(r) {
    var sel = state.selectedRestaurants.has(r.id);
    return '<div class="ms-option' + (sel ? ' selected' : '') + '" onclick="toggleRestaurant(\'' + r.id + '\')">'
      + '<span class="ms-option-check">✓</span>'

function toggleRestaurant(id) {

/* ── 品項列表輔助 ── */
function maybeRefreshPerItem() {
  if (document.getElementById('markup-type-per-item') && document.getElementById('markup-type-per-item').checked) renderPerItemList();
}

function renderPerItemList() {
  var listEl = document.getElementById('per-item-list');
  var emptyEl = document.getElementById('per-item-empty');
  var items = [];
  restaurants.filter(function(r) { return state.selectedRestaurants.has(r.id); })
    .forEach(function(r) {
      r.items.forEach(function(item) {
        if (!items.find(function(i) { return i.id === item.id; })) {
          items.push(item);
        }
      });
    });

  if (items.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = items.map(function(item) {
    return '<div class="per-item-row">'
      + '<span class="per-item-name">' + item.name + '</span>'
      + '<span class="per-item-price">店內價 $' + item.price + '</span>'
      + '<input type="number" class="per-item-input" min="0" placeholder="0"'
      + ' id="markup-item-' + item.id + '">'
      + '<span class="input-unit">元</span>'
      + '</div>';
  }).join('');
}

/* ── 互動：定價模式 ── */
function onModeChange() {
  var val = document.querySelector('input[name="pricing-mode"]:checked').value;
  document.getElementById('mode-discount-form').style.display = (val === 'discount') ? '' : 'none';
  document.getElementById('mode-markup-form').style.display   = (val === 'markup')   ? '' : 'none';
  if (val === 'markup') {
    if (document.getElementById('markup-type-per-item').checked) renderPerItemList();
  }
}

function onMarkupTypeChange(changed) {
  var fixedEl   = document.getElementById('markup-type-fixed');
  var perItemEl = document.getElementById('markup-type-per-item');
  // 互斥：勾選其中一個時自動取消另一個
  if (changed === 'fixed'    && fixedEl.checked)   perItemEl.checked = false;
  if (changed === 'per-item' && perItemEl.checked)  fixedEl.checked   = false;
  document.getElementById('fixed-markup-wrap').style.display    = fixedEl.checked   ? '' : 'none';
  document.getElementById('per-item-markup-wrap').style.display = perItemEl.checked ? '' : 'none';
  if (perItemEl.checked) renderPerItemList();
}

function onGuaranteeToggle() {
  var checked = document.getElementById('guarantee-check').checked;
  document.getElementById('guarantee-input-wrap').style.display = checked ? '' : 'none';
}

/* ── 折後價即時預覽 ── */
function onDiscountChange() {
  var pct = parseInt(document.getElementById('discount-pct').value, 10);
  var preview = document.getElementById('discount-preview');
  if (isNaN(pct) || pct < 1 || pct > 99) {
    preview.style.display = 'none';
    return;
  }
  var item = getFirstSelectedItem();
  var text;
  if (item) {
    var result = Math.round(item.price * pct / 100);
    text = '示例：$' + item.price + ' × ' + pct + '% = $' + result + '（' + item.name + '）';
  } else {
    text = '計算公式：店內價 × ' + pct + ' ÷ 100';
  }
  preview.textContent = text;
  preview.style.display = '';
}

/* ── 規則資料 ── */
var savedRules = [];
var CURRENT_USER = '王小明（營運部）';  // 實際串接時替換為登入者資訊

/* 列表篩選狀態 */
var filterState = {
  companies: new Set(),
  sites:     new Set(),
  mode:      '',
  enabled:   '',
};

function buildRuleData() {
  var mode = document.querySelector('input[name="pricing-mode"]:checked').value;
  var sites = SITES.filter(function(s) { return state.selectedSites.has(s.id); });
  var branches = [];
  restaurants.filter(function(r) { return state.selectedRestaurants.has(r.id); })
    .forEach(function(r) {
      getBranchKeys(r).forEach(function(k) {
        if (state.selectedBranches.has(k)) {
          branches.push({ restName: r.name, branchLabel: getBranchLabel(r, k) });
        }
      });
    });

  var rule = {
    id: Date.now(),
    enabled: false,
    createdAt: new Date().toLocaleString('zh-TW', {hour12: false}),
    operator: CURRENT_USER,
    sites: sites,
    branches: branches,
    mode: mode,
  };

  if (mode === 'discount') {
    rule.discountStart = document.getElementById('discount-start').value;
    rule.discountEnd   = document.getElementById('discount-end').value;
    rule.discountPct   = parseInt(document.getElementById('discount-pct').value, 10);
  } else {
    var fixedChecked   = document.getElementById('markup-type-fixed').checked;
    var perItemChecked = document.getElementById('markup-type-per-item').checked;
    rule.markupFixed   = fixedChecked;
    rule.markupPerItem = perItemChecked;
    var guaranteed = document.getElementById('guarantee-check').checked;
    rule.guaranteeAmount = guaranteed ? (parseFloat(document.getElementById('guarantee-amount').value) || null) : null;
    if (fixedChecked) {
      rule.fixedMarkup = parseFloat(document.getElementById('fixed-markup-amount').value) || 0;
    }
    if (perItemChecked) {
      var perItems = [];
      document.querySelectorAll('#per-item-list .per-item-row').forEach(function(row) {
        var input = row.querySelector('.per-item-input');
        var name  = row.querySelector('.per-item-name').textContent;
        var price = row.querySelector('.per-item-price').textContent;
        var amt   = input.value !== '' ? parseFloat(input.value) : null;
        if (amt !== null) perItems.push({ name: name, price: price, markup: amt });
      });
      rule.perItems = perItems;
    }
  }
  return rule;
}

function getFilterSites() {
  if (filterState.companies.size === 0) return SITES;
  return SITES.filter(function(s) { return filterState.companies.has(s.company); });
}

function toggleFilterCompany(id) {

function renderRuleCard(rule) {
  var siteBadges = rule.sites.map(function(s) {
    return '<span class="rule-site-badge">' + s.name + '</span>';
  }).join('');

  var branchText = rule.branches.map(function(b) {
    return b.restName + (b.branchLabel !== '主店' ? '・' + b.branchLabel : '');
  }).join('、');

  var modeBadge, modeDetail;
  if (rule.mode === 'discount') {
    modeBadge = '<span class="rule-mode-badge rule-mode-discount">打折販售</span>';
    modeDetail = '<div class="rule-field"><div class="rule-field-label">折扣</div>'
      + '<div class="rule-field-value">' + rule.discountPct + '%</div></div>'
      + '<div class="rule-field"><div class="rule-field-label">生效期間</div>'
      + '<div class="rule-field-value">' + rule.discountStart + ' ～ ' + rule.discountEnd + '</div></div>';
  } else {
    modeBadge = '<span class="rule-mode-badge rule-mode-markup">加價販售</span>';
    var markupParts = [];
    if (rule.markupFixed)   markupParts.push('固定加價 +$' + rule.fixedMarkup);
    if (rule.markupPerItem) markupParts.push('單品加價（' + (rule.perItems || []).length + ' 項）');
    var markupDesc = markupParts.join('、') || '—';
    var guaranteeDesc = rule.guaranteeAmount != null ? '$' + rule.guaranteeAmount : '不設保障';
    modeDetail = '<div class="rule-field"><div class="rule-field-label">加價方式</div>'
      + '<div class="rule-field-value">' + markupDesc + '</div></div>'
      + '<div class="rule-field"><div class="rule-field-label">保障金額</div>'
      + '<div class="rule-field-value">' + guaranteeDesc + '</div></div>';
  }

  return '<div class="rule-card" id="rule-' + rule.id + '">'
    + '<div class="rule-site-badges">' + siteBadges + '</div>'
    + modeBadge
    + '<div class="rule-card-body">'
    + '<div class="rule-field"><div class="rule-field-label">餐廳 / 分店</div>'
    + '<div class="rule-field-value">' + (branchText || '—') + '</div></div>'
    + modeDetail
    + '</div>'
    + '<span class="rule-meta">' + rule.operator + '・' + rule.createdAt + '</span>'
    + '<div class="rule-card-actions">'
    + '<div class="rule-toggle-wrap">'
    + '<label class="toggle-switch"><input type="checkbox"' + (rule.enabled ? ' checked' : '') + ' onchange="toggleRuleEnabled(' + rule.id + ',this.checked)">'
    + '<div class="toggle-track"><div class="toggle-knob"></div></div></label>'
    + '<span class="toggle-label-text">' + (rule.enabled ? '啟用中' : '已停用') + '</span>'
    + '</div>'
    + '<button class="btn-del" onclick="deleteRule(' + rule.id + ')">刪除</button>'
    + '</div>'
    + '</div>';
}

function setFilterMode(val, btn) {
  filterState.mode = val;
  btn.closest('.filter-btn-group').querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderRulesList();
}

function setFilterEnabled(val, btn) {
  filterState.enabled = val;
  btn.closest('.filter-btn-group').querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderRulesList();
}

function getFilteredRules() {
  return savedRules.filter(function(rule) {
    // 若篩選公司：規則的 site 必須有至少一個屬於已選公司
    if (filterState.companies.size > 0) {
      var hasCo = rule.sites.some(function(s) {
        var found = SITES.find(function(x) { return x.id === s.id; });
        return found && filterState.companies.has(found.company);
      });
      if (!hasCo) return false;
    }
    // 若篩選據點：規則的 site 必須有至少一個在已選據點中
    if (filterState.sites.size > 0) {
      var hasSite = rule.sites.some(function(s) { return filterState.sites.has(s.id); });
      if (!hasSite) return false;
    }
    if (filterState.mode && rule.mode !== filterState.mode) return false;
    if (filterState.enabled === '1' && !rule.enabled) return false;
    if (filterState.enabled === '0' &&  rule.enabled) return false;
    return true;
  });
}

function renderRulesList() {
  var section = document.getElementById('rules-section');
  var list    = document.getElementById('rules-list');
  var count   = document.getElementById('rules-count');
  if (savedRules.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  renderFilterCompanyDropdown();
  renderFilterSiteDropdown();
  var filtered = getFilteredRules();
  count.textContent = filtered.length + ' / ' + savedRules.length + ' 筆';
  if (filtered.length === 0) {
    list.innerHTML = '<div class="rules-filter-empty">無符合篩選條件的規則</div>';
  } else {
    list.innerHTML = filtered.slice().reverse().map(renderRuleCard).join('');
  }
}

function toggleRuleEnabled(id, enabled) {
  var rule = savedRules.find(function(r) { return r.id === id; });
  if (rule) {
    rule.enabled = enabled;
    renderRulesList();
  }
}

function deleteRule(id) {
  if (!confirm('確定要刪除此規則？此操作無法復原。')) return;
  savedRules = savedRules.filter(function(r) { return r.id !== id; });
  renderRulesList();
  showToast('已刪除規則');
}

/* ── 表單驗證 ── */
function validateForm() {
  if (state.selectedSites.size === 0)    return '請至少選擇一個套用據點';
  if (state.selectedBranches.size === 0) return '請至少選擇一個分店';

  var mode = document.querySelector('input[name="pricing-mode"]:checked').value;
  if (mode === 'discount') {
    var start = document.getElementById('discount-start').value;
    var end   = document.getElementById('discount-end').value;
    var pct   = parseInt(document.getElementById('discount-pct').value, 10);
    if (!start) return '請選擇起始日期';
    if (!end)   return '請選擇結束日期';
    if (start > end) return '結束日期不得早於起始日期';
    if (isNaN(pct) || pct < 1 || pct > 99) return '折扣%數須介於 1～99';
  } else {
    var fixedCk   = document.getElementById('markup-type-fixed').checked;
    var perItemCk = document.getElementById('markup-type-per-item').checked;
    if (fixedCk) {
      var amt = document.getElementById('fixed-markup-amount').value;
      if (amt === '' || parseFloat(amt) < 0) return '請輸入有效的固定加價金額（≥ 0）';
    }
    if (perItemCk) {
      var inputs = document.querySelectorAll('#per-item-list .per-item-input');
      if (inputs.length === 0) return '請先在 Step 2 選擇餐廳以設定單品加價';
      var hasAny = Array.from(inputs).some(function(i) { return i.value !== '' && parseFloat(i.value) >= 0; });
      if (!hasAny) return '請至少設定一個品項的加價金額';
    }
  }
  return null;
}

/* ── 送出 ── */
function submitPricing() {
  var err = validateForm();
  if (err) { showToast(err, 'error'); return; }
  var rule = buildRuleData();
  savedRules.push(rule);
  renderRulesList();
  showToast('已儲存設定');
  setTimeout(function() {
    document.getElementById('rules-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 300);
}

/* ── 清除重填 ── */
function resetForm() {
  state.selectedCompanies.clear();
  state.selectedRegions.clear();
  state.selectedRestaurants.clear();
  state.selectedBranches.clear();
  state.selectedSites.clear();
  renderCompanyDropdown();
  renderSiteDropdown();
  renderRegionDropdown();
  renderRestDropdown();
  renderBranchDropdown();
  updateStep1Summary();
  updateStep2Summary();

  document.getElementById('discount-start').value  = '';
  document.getElementById('discount-end').value    = '';
  document.getElementById('discount-pct').value    = '';
  document.getElementById('discount-preview').style.display = 'none';

  document.getElementById('fixed-markup-amount').value = '';
  document.getElementById('guarantee-check').checked   = false;
  document.getElementById('guarantee-amount').value    = '';
  document.getElementById('guarantee-input-wrap').style.display = 'none';

  document.querySelector('input[name="pricing-mode"][value="markup"]').checked = true;
  document.getElementById('markup-type-fixed').checked    = false;
  document.getElementById('markup-type-per-item').checked = false;
  onModeChange();
  onMarkupTypeChange();
}

/* ── Toast ── */
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2400);
}

/* ── 初始化 ── */
document.addEventListener('DOMContentLoaded', function() {
  renderCompanyDropdown();
  renderSiteDropdown();
  renderRegionDropdown();
  renderRestDropdown();
  renderBranchDropdown();
  updateStep1Summary();
  updateStep2Summary();
  document.getElementById('step1-summary').style.display = 'none';
  document.getElementById('step2-summary').style.display = 'none';
  document.getElementById('per-item-empty').style.display = 'none';
  // panel 內點擊不冒泡，避免觸發外部關閉邏輯
  document.querySelectorAll('.ms-panel').forEach(function(panel) {
    panel.addEventListener('click', function(e) { e.stopPropagation(); });
  });
});
</script>
</body>
</html>
