<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" type="image/png" href="圖片/LOGO.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單管理 — 內部後台</title>
  <link rel="stylesheet" href="shared-nav.css">
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #f3f2ef;
  --card:        #ffffff;
  --bg-2:        #fafaf9;
  --bg-3:        #eeece9;
  --border:      #e5e5e4;
  --border-2:    #efefed;
  --text:        #1c1b1a;
  --text-2:      #57534e;
  --text-3:      #78716c;
  --blue:        #1d4ed8;
  --blue-bg:     #eff6ff;
  --blue-border: #bfdbfe;
  --blue-text:   #1e40af;
  --green:       #15803d;
  --green-bg:    #f0fdf4;
  --green-bdr:   #bbf7d0;
  --orange:      #c2410c;
  --orange-bg:   #fff7ed;
  --orange-bdr:  #fed7aa;
  --red:         #b91c1c;
  --red-bg:      #fef2f2;
  --red-bdr:     #fecaca;
  --yellow:      #a16207;
  --yellow-bg:   #fefce8;
  --yellow-bdr:  #fde68a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
               "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}

.page { max-width: 1400px; margin: 0 auto; padding: 12px 20px 80px; }

/* ─── 麵包屑 ─── */
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 16px;
  font-size: 14px; color: var(--text-3);
}
.bc-item { color: var(--text-2); }
.bc-sep  { color: var(--text-3); }

/* ─── Header ─── */
.page-header { margin-bottom: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title  { font-size: 22px; font-weight: 600; }
.page-sub    { font-size: 15px; color: var(--text-3); margin-top: 3px; }

/* ─── Toolbar ─── */
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
}
.toolbar-label { font-size: 15px; color: var(--text-2); white-space: nowrap; }
.toolbar-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.toolbar-spacer { flex: 1; }

/* ─── 按鈕 ─── */
.btn {
  padding: 7px 14px; border-radius: 6px;
  font-size: 15px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text-2);
  transition: all .12s; display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap; font-family: inherit;
}
.btn:hover { border-color: #a8a29e; color: var(--text); }
.btn-primary {
  background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600;
}
.btn-primary:hover { background: #1e40af; border-color: #1e40af; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 14px; }
.btn-danger { border-color: var(--red-bdr); color: var(--red); background: var(--red-bg); }
.btn-danger:hover { background: #fee2e2; border-color: var(--red); }


/* 日期輸入 */
.date-input {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 15px; color: var(--text); background: var(--card);
  font-family: inherit; cursor: pointer;
}
.date-input:focus { outline: none; border-color: var(--blue); }

/* ─── 日期選擇按鈕 ─── */
.date-range-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 15px; color: var(--text); background: var(--card);
  font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: border-color .12s;
}
.date-range-btn:hover { border-color: #a8a29e; }
.date-range-btn.active { border-color: var(--blue); }
.date-range-btn .drb-icon { font-size: 16px; color: var(--text-3); }
.date-range-btn .drb-label { color: var(--text-2); font-size: 14px; }

/* ─── 月曆 Popover ─── */
.cal-overlay {
  position: fixed; inset: 0; z-index: 900;
  background: transparent;
}
.cal-popover {
  position: fixed; z-index: 901;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.14);
  padding: 16px; width: 308px;
  opacity: 0; transform: translateY(-6px);
  transition: opacity .15s, transform .15s;
  pointer-events: none;
}
.cal-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* 起訖顯示列 */
.cal-range-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
}
.cal-range-date {
  flex: 1; text-align: center;
}
.cal-range-date .crd-label { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.cal-range-date .crd-val {
  font-size: 15px; font-weight: 600; color: var(--text);
  font-family: 'SF Mono', Consolas, monospace;
}
.cal-range-date .crd-val.empty { color: var(--text-3); font-weight: 400; font-family: inherit; }
.cal-range-sep { font-size: 18px; color: var(--text-3); }

/* 月份導覽 */
.cal-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.cal-nav-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 16px; color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  transition: all .1s;
}
.cal-nav-btn:hover { background: var(--bg-2); color: var(--text); }
.cal-month-label { font-size: 16px; font-weight: 600; color: var(--text); }

/* 格線 */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
}
.cal-weekday {
  text-align: center; font-size: 12px; color: var(--text-3);
  padding: 4px 0; font-weight: 600;
}
.cal-day {
  text-align: center; font-size: 14px; padding: 6px 0;
  border-radius: 6px; cursor: pointer; transition: all .1s;
  color: var(--text);
  position: relative;
}
.cal-day:hover:not(.cal-day-empty):not(.cal-day-disabled) { background: var(--bg-3); }
.cal-day-empty { cursor: default; }
.cal-day-disabled { color: var(--text-3); cursor: default; }
.cal-day-from { background: var(--blue) !important; color: #fff !important; border-radius: 6px 0 0 6px; }
.cal-day-to   { background: var(--blue) !important; color: #fff !important; border-radius: 0 6px 6px 0; }
.cal-day-from.cal-day-same-day { border-radius: 6px !important; }
.cal-day-in-range { background: var(--blue-bg); color: var(--blue-text); border-radius: 0; }
.cal-day-today::after {
  content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; background: var(--blue); border-radius: 50%;
}
.cal-day-from.cal-day-today::after,
.cal-day-to.cal-day-today::after { background: #fff; }

/* 底部按鈕列 */
.cal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.cal-footer .btn-sm { font-size: 13px; }

/* ─── 統計列 ─── */
.summary-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px;
}
.summary-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; display: flex; flex-direction: column; gap: 4px;
}
.summary-label { font-size: 15px; color: var(--text-3); }
.summary-value { font-size: 28px; font-weight: 700; color: var(--text); }
@media (max-width: 600px) {
  .summary-bar { grid-template-columns: repeat(2, 1fr); }
}
.summary-value.blue { color: var(--blue); }
.summary-value.green { color: var(--green); }
.summary-value.orange { color: var(--orange); }

/* ─── 表格 ─── */
.table-wrap {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden;
}
table {
  width: 100%; border-collapse: collapse; font-size: 15px;
}
thead th {
  background: var(--bg-2); color: var(--text-2); font-weight: 600;
  padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
  white-space: nowrap; font-size: 14px;
}
tbody tr { border-bottom: 1px solid var(--border-2); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg-2); }
tbody tr.detail-row { background: var(--bg-3); }
tbody tr.detail-row:hover { background: #e8e5e1; }
td { padding: 10px 14px; vertical-align: middle; }

.td-mono { font-family: 'SF Mono', Consolas, monospace; font-size: 14px; color: var(--text-2); }

/* 訂單類型 badge */
.type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: 13px; font-weight: 700;
}
.type-R { background: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }
.type-S { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-bdr); }

/* 餐期 badge */
.period-badge {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: 13px; font-weight: 600;
  background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border);
}

/* 訂單狀態 badge */
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 100px;
  font-size: 13px; font-weight: 600;
}
.status-已完成  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-bdr); }
.status-處理中  { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-bdr); }
.status-已成立  { background: var(--blue-bg);   color: var(--blue-text); border: 1px solid var(--blue-border); }
.status-異常    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-bdr); }
.status-已取消  { background: var(--bg-3);      color: var(--text-3); border: 1px solid var(--border); }

/* 操作欄 */
.action-group { display: flex; gap: 6px; flex-wrap: nowrap; }
.btn.active { background: var(--blue-bg); border-color: var(--blue-border); color: var(--blue-text); }

/* 展開的明細行 */
.detail-inner {
  padding: 12px 16px;
}
.detail-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.detail-table th {
  background: var(--bg-3); color: var(--text-3); font-weight: 600;
  padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--border);
}
.detail-table td { padding: 7px 12px; border-bottom: 1px solid var(--border-2); }
.detail-table tr:last-child td { border-bottom: none; }

/* ─── Drawer ─── */
.drawer-overlay {
  position: fixed; top: 48px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 1000;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 48px; right: 0; bottom: 0; z-index: 1001;
  background: var(--card); box-shadow: -4px 0 24px rgba(0,0,0,.12);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
  width: 460px;
}
.drawer.open { transform: translateX(0); }
.drawer-lg { width: 620px; }

.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.drawer-title { font-size: 18px; font-weight: 600; }
.drawer-sub { font-size: 14px; color: var(--text-3); margin-top: 2px; }
.drawer-close {
  width: 32px; height: 32px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text-3); transition: all .12s;
}
.drawer-close:hover { background: var(--bg-2); color: var(--text); }

.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-footer {
  display: flex; gap: 10px; padding: 16px 20px;
  border-top: 1px solid var(--border); flex-shrink: 0;
  justify-content: flex-end;
}

/* ─── 表單 ─── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 14px; font-weight: 600; color: var(--text-2); }
.form-label .required { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 15px; color: var(--text); background: var(--card);
  font-family: inherit; transition: border-color .12s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--blue);
}
.form-input[readonly], .form-select[disabled] {
  background: var(--bg-2); color: var(--text-2); cursor: default;
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 13px; color: var(--text-3); }

/* ─── 新增特殊訂單：訂單資訊卡 ─── */
.order-info-card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 20px;
}
.order-info-card .section-title {
  font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.order-id-display {
  font-family: 'SF Mono', Consolas, monospace; font-size: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 12px; color: var(--blue-text); font-weight: 600; letter-spacing: .5px;
}

/* ─── 新增訂單明細表格 ─── */
.new-detail-section .section-title {
  font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 10px;
}
.new-detail-table-wrap {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  margin-bottom: 10px;
}
.new-detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.new-detail-table th {
  background: var(--bg-2); color: var(--text-3); font-weight: 600;
  padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.new-detail-table td { padding: 7px 8px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
.new-detail-table tr:last-child td { border-bottom: none; }
.new-detail-table .form-select, .new-detail-table .form-input {
  padding: 5px 8px; font-size: 14px;
}
.new-detail-table .form-input[readonly] { background: var(--bg-2); min-width: 60px; }

.btn-add-row {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 14px; color: var(--blue); cursor: pointer;
  background: none; border: 1px dashed var(--blue-border);
  padding: 6px 14px; border-radius: 6px; transition: all .12s;
  font-family: inherit;
}
.btn-add-row:hover { background: var(--blue-bg); }

/* ─── Toast ─── */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #1c1b1a; color: #fff; padding: 11px 18px;
  border-radius: 8px; font-size: 15px; z-index: 3000;
  display: none; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  max-width: 340px;
}

/* ─── 空狀態 ─── */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--text-3);
}
.empty-state-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state-text { font-size: 16px; }

/* ─── 響應式 ─── */
@media (max-width: 900px) {
  .hide-md { display: none; }
  .drawer { width: 100%; }
  .drawer-lg { width: 100%; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: 1; }
}
@media (max-width: 600px) {
  .hide-sm { display: none; }
  .summary-bar { gap: 8px; }
  .summary-card { min-width: 90px; padding: 8px 12px; }
}
  </style>
</head>
<body>
<script src="shared-nav.js"></script>

<div class="page">
  <!-- 麵包屑 -->
  <nav class="breadcrumb">
    <span class="bc-item">內部後台</span>
    <span class="bc-sep">›</span>
    <span class="bc-item">訂單管理</span>
  </nav>

  <!-- 頁首 -->
  <div class="page-header">
    <div>
      <div class="page-title">訂單管理</div>
      <div class="page-sub">查詢、追蹤與處理訂單異常</div>
    </div>
    <button class="btn btn-primary" onclick="openNewOrderDrawer()">＋ 新增特殊訂單</button>
  </div>

  <!-- 工具列 -->
  <div class="toolbar">
    <span class="toolbar-label">檢視方式</span>
    <select class="date-input" id="viewModeSelect" onchange="setViewMode(this.value)">
      <option value="meal">出餐日期</option>
      <option value="created">訂單成立日期</option>
    </select>
    <div class="toolbar-sep"></div>
    <span class="toolbar-label">日期範圍</span>
    <button class="date-range-btn" id="dateRangeBtn" onclick="toggleCal(event)">
      <span class="drb-icon">📅</span>
      <span id="dateRangeLabel" class="drb-label">選擇日期</span>
    </button>
    <button class="btn btn-sm" onclick="setToday()">今天</button>
    <div class="toolbar-spacer"></div>
  </div>
  <!-- 隱藏的日期值，供篩選邏輯使用 -->
  <input type="hidden" id="dateFrom">
  <input type="hidden" id="dateTo">

  <!-- 月曆 Popover -->
  <div class="cal-overlay" id="calOverlay" style="display:none" onclick="closeCal()"></div>
  <div class="cal-popover" id="calPopover">
    <div class="cal-range-bar">
      <div class="cal-range-date">
        <div class="crd-label">起始日</div>
        <div class="crd-val empty" id="calFrom">—</div>
      </div>
      <span class="cal-range-sep">→</span>
      <div class="cal-range-date">
        <div class="crd-label">截止日</div>
        <div class="crd-val empty" id="calTo">—</div>
      </div>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
      <span class="cal-month-label" id="calMonthLabel"></span>
      <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-footer">
      <button class="btn btn-sm" onclick="calClear()">清除</button>
      <button class="btn btn-sm btn-primary" onclick="calConfirm()">確認</button>
    </div>
  </div>

  <!-- 統計列 -->
  <div class="summary-bar" id="summaryBar"></div>

  <!-- 訂單列表 -->
  <div class="table-wrap">
    <table id="orderTable">
      <thead>
        <tr>
          <th>訂單編號</th>
          <th class="hide-md">訂單成立日期</th>
          <th>出餐日期</th>
          <th>據點名稱</th>
          <th>訂單類型</th>
          <th>餐期</th>
          <th class="hide-sm">會員編號</th>
          <th class="hide-sm">會員電話號碼</th>
          <th>訂單狀態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="orderTbody"></tbody>
    </table>
  </div>
</div>

<!-- 異常處理 Drawer -->
<div class="drawer-overlay" id="anomalyOverlay" onclick="closeAnomalyDrawer()"></div>
<div class="drawer" id="anomalyDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">異常處理</div>
      <div class="drawer-sub" id="anomalyDrawerSub">訂單編號</div>
    </div>
    <button class="drawer-close" onclick="closeAnomalyDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">異常類別<span class="required">*</span></label>
        <select class="form-select" id="anomalyType">
          <option value="">請選擇</option>
          <option>廚房出餐異常</option>
          <option>物流配送異常</option>
          <option>餐點品質異常</option>
          <option>客戶端異常</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">責任歸屬<span class="required">*</span></label>
        <select class="form-select" id="anomalyResp">
          <option value="">請選擇</option>
          <option>餐廳</option>
          <option>物流</option>
          <option>公司吸收</option>
          <option>客戶自負</option>
        </select>
      </div>
      <div class="form-field span-2">

var TYPE_LABEL   = { R: '一般', S: '特殊' };

/* ════════════════════════════════
   展開明細狀態
════════════════════════════════ */
var expandedRows = {};
var anomalyOrderId = null;

/* ════════════════════════════════
   檢視模式
════════════════════════════════ */
function setViewMode(mode) {
  viewMode = mode;
  renderTable();

function setToday() {

/* ════════════════════════════════
   月曆 Popover
════════════════════════════════ */
var calYear, calMonth;
var calStep = 0; // 0=尚未選, 1=已選起, 2=已選迄

function toggleCal(e) {
  e.stopPropagation();
  var pop = document.getElementById('calPopover');
  var overlay = document.getElementById('calOverlay');
  if (pop.classList.contains('open')) { closeCal(); return; }

  // 定位到按鈕下方
  var btn = document.getElementById('dateRangeBtn');
  var rect = btn.getBoundingClientRect();
  pop.style.top  = (rect.bottom + 6) + 'px';
  pop.style.left = rect.left + 'px';

  // 初始化月份（以 dateFrom 為準，若無則今天）
  var fromVal = document.getElementById('dateFrom').value;
  var base = fromVal ? new Date(fromVal + 'T00:00:00') : new Date();
  calYear  = base.getFullYear();
  calMonth = base.getMonth();

  // 同步 calStep
  var toVal = document.getElementById('dateTo').value;
  calStep = fromVal ? (toVal ? 2 : 1) : 0;

  renderCalRange();
  renderCalGrid();
  overlay.style.display = 'block';
  requestAnimationFrame(function() { pop.classList.add('open'); });
  document.getElementById('dateRangeBtn').classList.add('active');
}

function closeCal() {
  var pop = document.getElementById('calPopover');
  pop.classList.remove('open');
  var overlay = document.getElementById('calOverlay');
  setTimeout(function() { overlay.style.display = 'none'; }, 160);
  document.getElementById('dateRangeBtn').classList.remove('active');
}

function calPrevMonth() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalGrid();
}

function calNextMonth() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalGrid();
}

var CAL_WD = ['日','一','二','三','四','五','六'];
var CAL_MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function renderCalGrid() {
  document.getElementById('calMonthLabel').textContent = calYear + ' 年 ' + CAL_MONTH_NAMES[calMonth];

  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var today = new Date().toISOString().slice(0, 10);
  var fromVal = document.getElementById('dateFrom').value;
  var toVal   = document.getElementById('dateTo').value;

  var html = CAL_WD.map(function(w) {
    return '<div class="cal-weekday">' + w + '</div>';
  }).join('');

  for (var i = 0; i < firstDay; i++) {
    html += '<div class="cal-day cal-day-empty"></div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var ds = calYear + '-' + pad2(calMonth + 1) + '-' + pad2(d);
    var cls = 'cal-day';
    if (ds === today) cls += ' cal-day-today';
    if (fromVal && toVal) {
      if (ds === fromVal) cls += ' cal-day-from' + (fromVal === toVal ? ' cal-day-same-day' : '');
      else if (ds === toVal) cls += ' cal-day-to';
      else if (ds > fromVal && ds < toVal) cls += ' cal-day-in-range';
    } else if (fromVal && ds === fromVal) {
      cls += ' cal-day-from cal-day-same-day';
    }
    html += '<div class="' + cls + '" onclick="calPickDay(\'' + ds + '\')">' + d + '</div>';
  }

  document.getElementById('calGrid').innerHTML = html;
}

function calPickDay(ds) {
  if (calStep === 0 || calStep === 2) {
    // 第一下：填起
    document.getElementById('dateFrom').value = ds;
    document.getElementById('dateTo').value   = '';
    calStep = 1;
  } else {
    // 第二下：填迄（若小於起則對調）
    var from = document.getElementById('dateFrom').value;
    if (ds < from) {
      document.getElementById('dateTo').value   = from;
      document.getElementById('dateFrom').value = ds;
    } else {
      document.getElementById('dateTo').value = ds;
    }
    calStep = 2;
    // 選完自動確認
    setTimeout(calConfirm, 180);
    renderCalRange();
    renderCalGrid();
    return;
  }
  renderCalRange();
  renderCalGrid();
}

function renderCalRange() {
  var fromVal = document.getElementById('dateFrom').value;
  var toVal   = document.getElementById('dateTo').value;
  var fromEl = document.getElementById('calFrom');
  var toEl   = document.getElementById('calTo');
  fromEl.textContent = fromVal || '—';
  fromEl.className = 'crd-val' + (fromVal ? '' : ' empty');
  toEl.textContent = toVal || '—';
  toEl.className = 'crd-val' + (toVal ? '' : ' empty');
}

function calClear() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value   = '';
  calStep = 0;
  renderCalRange();
  renderCalGrid();
  updateDateRangeLabel();
  renderTable();
}

function calConfirm() {
  closeCal();
  updateDateRangeLabel();
  renderTable();
}

function updateDateRangeLabel() {
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  var lbl  = document.getElementById('dateRangeLabel');
  if (from && to && from === to) {
    lbl.textContent = from;
  } else if (from && to) {
    lbl.textContent = from + ' ～ ' + to;
  } else if (from) {
    lbl.textContent = from + ' ～ …';
  } else {
    lbl.textContent = '選擇日期';
  }
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

/* ════════════════════════════════
   過濾與統計
════════════════════════════════ */
function getFilteredOrders() {
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  return ORDERS.filter(function(o) {
    var d = viewMode === 'meal' ? o.mealDate : o.createdAt;
    return (!from || d >= from) && (!to || d <= to);
  });
}

/* ════════════════════════════════
   渲染統計
════════════════════════════════ */
function renderSummary(orders) {
  var total    = orders.length;
  var completed = orders.filter(function(o) { return o.status === '已完成'; }).length;
  var anomaly   = orders.filter(function(o) { return o.status === '異常'; }).length;
  var pending   = total - completed - anomaly;

  document.getElementById('summaryBar').innerHTML =
    card('訂單總數', total, 'blue') +
    card('已完成', completed, 'green') +
    card('待處理', pending, '') +
    card('異常', anomaly, 'orange');
}

function card(label, val, cls) {
  return '<div class="summary-card"><div class="summary-label">' + label + '</div>' +
    '<div class="summary-value' + (cls ? ' ' + cls : '') + '">' + val + '</div></div>';
}

/* ════════════════════════════════
   渲染表格
════════════════════════════════ */
function renderTable() {
  var orders = getFilteredOrders();
  renderSummary(orders);
  var tbody = document.getElementById('orderTbody');

  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state">' +
      '<div class="empty-state-icon">📋</div>' +
      '<div class="empty-state-text">此日期範圍內沒有訂單</div>' +
      '</div></td></tr>';
    return;
  }

  tbody.innerHTML = '';
  orders.forEach(function(o) {
    tbody.appendChild(buildOrderRow(o));
    if (expandedRows[o.id]) {
      tbody.appendChild(buildDetailRow(o.id));
    }
  });
}

function buildOrderRow(o) {
  var tr = document.createElement('tr');
  tr.id = 'row-' + o.id;
  tr.innerHTML =
    '<td class="td-mono">' + escHtml(o.id) + '</td>' +
    '<td class="hide-md">' + o.createdAt + '</td>' +
    '<td>' + o.mealDate + '</td>' +
    '<td>' + escHtml(o.site) + '</td>' +
    '<td><span class="type-badge type-' + o.type + '">' + (TYPE_LABEL[o.type] || o.type) + ' (' + o.type + ')</span></td>' +
    '<td><span class="period-badge">' + (PERIOD_LABEL[o.period] || o.period) + '</span></td>' +
    '<td class="hide-sm td-mono">' + escHtml(o.memberId) + '</td>' +
    '<td class="hide-sm">' + escHtml(o.phone) + '</td>' +
    '<td><span class="status-badge status-' + o.status + '">' + escHtml(o.status) + '</span></td>' +
    '<td><div class="action-group">' +
      '<button class="btn btn-sm" id="detailBtn-' + o.id + '" onclick="toggleDetail(\'' + o.id + '\')">明細</button>' +
      '<button class="btn btn-sm" onclick="openAnomalyDrawer(\'' + o.id + '\')">異常處理</button>' +
    '</div></td>';
  return tr;
}

function buildDetailRow(orderId) {
  var details = ORDER_DETAILS[orderId] || [];
  var tr = document.createElement('tr');
  tr.className = 'detail-row';
  tr.id = 'detail-' + orderId;

  var detailRows = details.length ? details.map(function(d) {
    return '<tr>' +
      '<td>' + escHtml(d.brand) + '</td>' +
      '<td>' + escHtml(d.item) + '</td>' +
      '<td>' + d.qty + '</td>' +
      '<td>$' + d.price + '</td>' +
      '</tr>';
  }).join('') : '<tr><td colspan="4" style="color:var(--text-3);padding:10px 12px">無明細資料</td></tr>';

  tr.innerHTML = '<td colspan="10"><div class="detail-inner">' +
    '<div class="detail-title">訂單明細</div>' +
    '<table class="detail-table">' +
    '<thead><tr><th>品牌名稱</th><th>餐點名稱</th><th>餐點數量</th><th>餐點售價</th></tr></thead>' +
    '<tbody>' + detailRows + '</tbody>' +
    '</table></div></td>';
  return tr;
}

function toggleDetail(orderId) {
  if (expandedRows[orderId]) {
    delete expandedRows[orderId];
    var dr = document.getElementById('detail-' + orderId);
    if (dr) dr.remove();
    var btn = document.getElementById('detailBtn-' + orderId);
    if (btn) btn.classList.remove('active');
  } else {
    expandedRows[orderId] = true;
    var row = document.getElementById('row-' + orderId);
    if (row) {
      var dr = buildDetailRow(orderId);
      row.after(dr);
    }
    var btn = document.getElementById('detailBtn-' + orderId);
    if (btn) btn.classList.add('active');
  }
}

/* ════════════════════════════════
   異常處理 Drawer
════════════════════════════════ */
function openAnomalyDrawer(orderId) {
  anomalyOrderId = orderId;
  document.getElementById('anomalyDrawerSub').textContent = '訂單編號：' + orderId;
  document.getElementById('anomalyType').value   = '';
  document.getElementById('anomalyResp').value   = '';
  document.getElementById('anomalyRemedy').value = '';
  document.getElementById('anomalyAR').value     = '';
  document.getElementById('anomalyAP').value     = '';
  document.getElementById('anomalyNote').value   = '';
  document.getElementById('anomalyOverlay').classList.add('open');
  document.getElementById('anomalyDrawer').classList.add('open');
}

function closeAnomalyDrawer() {
  document.getElementById('anomalyOverlay').classList.remove('open');
  document.getElementById('anomalyDrawer').classList.remove('open');
}

function saveAnomaly() {
  var type   = document.getElementById('anomalyType').value;
  var resp   = document.getElementById('anomalyResp').value;
  var remedy = document.getElementById('anomalyRemedy').value;
  if (!type || !resp || !remedy) {
    showToast('請填寫所有必填欄位');
    return;
  }
  // 更新訂單狀態
  var order = ORDERS.find(function(o) { return o.id === anomalyOrderId; });
  if (order) order.status = '異常';
  closeAnomalyDrawer();
  renderTable();
  showToast('✅ 異常處理記錄已儲存');
}

/* ════════════════════════════════
   新增特殊訂單 Drawer
════════════════════════════════ */
var newDetailRows = [];
var newDetailId = 0;

function openNewOrderDrawer() {
  newDetailRows = [];
  newDetailId = 0;
  document.getElementById('no_mealDate').value  = '';
  document.getElementById('no_serviceId').value = '';
  document.getElementById('no_site').value      = '';
  document.getElementById('no_period').value    = '';
  document.getElementById('no_memberId').innerHTML = '<option value="">請選擇</option>';
  document.getElementById('no_phone').value     = '';
  document.getElementById('no_orderId').textContent = '— 請先選擇出餐日期、餐期服務編號與會員 —';
  document.getElementById('newDetailTbody').innerHTML = '';
  document.getElementById('newOrderOverlay').classList.add('open');
  document.getElementById('newOrderDrawer').classList.add('open');
}

function closeNewOrderDrawer() {
  document.getElementById('newOrderOverlay').classList.remove('open');
  document.getElementById('newOrderDrawer').classList.remove('open');
}

function onServiceChange() {
  var sid = document.getElementById('no_serviceId').value;
  var svc = SERVICE_MAP[sid];
  if (!svc) {
    document.getElementById('no_site').value   = '';
    document.getElementById('no_period').value = '';
    document.getElementById('no_memberId').innerHTML = '<option value="">請選擇</option>';
    document.getElementById('no_phone').value  = '';
    genOrderId();
    return;
  }
  document.getElementById('no_site').value   = svc.site;
  document.getElementById('no_period').value = (PERIOD_LABEL[svc.period] || svc.period) + ' (' + svc.period + ')';
  var sel = document.getElementById('no_memberId');
  sel.innerHTML = '<option value="">請選擇</option>' + svc.members.map(function(m) {
    return '<option value="' + m.id + '" data-phone="' + m.phone + '">' + m.id + ' — ' + m.name + '</option>';
  }).join('');
  document.getElementById('no_phone').value = '';
  genOrderId();
}

function onMemberSelect() {
  var sel = document.getElementById('no_memberId');
  var opt = sel.options[sel.selectedIndex];
  var phone = opt ? (opt.getAttribute('data-phone') || '') : '';
  document.getElementById('no_phone').value = phone;
  genOrderId();
}

function genOrderId() {
  var mealDate  = document.getElementById('no_mealDate').value;
  var serviceId = document.getElementById('no_serviceId').value;
  var memberId  = document.getElementById('no_memberId').value;
  var sid = document.getElementById('no_serviceId').value;
  var svc = SERVICE_MAP[sid];
  var periodCode = svc ? svc.period : '';

  if (!mealDate || !serviceId || !memberId || !periodCode) {
    document.getElementById('no_orderId').textContent = '— 請先選擇出餐日期、餐期服務編號與會員 —';
    return;
  }

  // 格式：出餐日期後6碼 + 會員編號 + 餐期服務編號（去除 -）
  var datePart    = mealDate.replace(/-/g, '').slice(2); // YYMMDD
  var serviceCode = serviceId.replace(/-/g, '');
  var orderId     = datePart + memberId + serviceCode;
  document.getElementById('no_orderId').textContent = orderId;
}

/* ─── 新增明細列 ─── */
function addDetailRow() {
  var rid = ++newDetailId;
  newDetailRows.push(rid);
  var tbody = document.getElementById('newDetailTbody');
  // 移除「尚未新增」提示列
  var empty = tbody.querySelector('tr[data-empty]');
  if (empty) empty.remove();

  var brandOpts = BRANDS.map(function(b) {
    return '<option value="' + escHtml(b.name) + '">' + escHtml(b.name) + '</option>';
  }).join('');
  var tr = document.createElement('tr');
  tr.id = 'dr-' + rid;
  tr.innerHTML =
    '<td><select class="form-select" id="dr-brand-' + rid + '" onchange="onBrandChange(' + rid + ')">' +
      '<option value="">請選擇</option>' + brandOpts +
    '</select></td>' +
    '<td><input class="form-input" id="dr-branch-' + rid + '" readonly placeholder="自動帶入"></td>' +
    '<td><select class="form-select" id="dr-item-' + rid + '" onchange="onItemChange(' + rid + ')">' +
      '<option value="">請先選品牌</option>' +
    '</select></td>' +
    '<td><input class="form-input" id="dr-price-' + rid + '" readonly placeholder="0"></td>' +
    '<td><input class="form-input" id="dr-cost-' + rid + '" readonly placeholder="0"></td>' +
    '<td><input type="number" class="form-input" id="dr-qty-' + rid + '" value="1" min="1" style="width:60px"></td>' +
    '<td><button class="btn btn-sm btn-danger" onclick="removeDetailRow(' + rid + ')">刪除</button></td>';
  tbody.appendChild(tr);
}

function removeDetailRow(rid) {
  newDetailRows = newDetailRows.filter(function(r) { return r !== rid; });
  var tr = document.getElementById('dr-' + rid);
  if (tr) tr.remove();
  // 若全部刪完則顯示提示
  if (!newDetailRows.length) {
    var tbody = document.getElementById('newDetailTbody');
    tbody.innerHTML = '<tr data-empty><td colspan="7" style="text-align:center;color:var(--text-3);padding:16px">尚未新增明細，請點擊下方「新增明細」按鈕</td></tr>';
  }
}

function renderDetailRows() {
  // 僅在 drawer 開啟初始化時呼叫，清空並顯示提示
  var tbody = document.getElementById('newDetailTbody');
  tbody.innerHTML = '<tr data-empty><td colspan="7" style="text-align:center;color:var(--text-3);padding:16px">尚未新增明細，請點擊下方「新增明細」按鈕</td></tr>';
}

function onBrandChange(rid) {
  var brandName = document.getElementById('dr-brand-' + rid).value;
  var brand = BRANDS.find(function(b) { return b.name === brandName; });
  var branchEl = document.getElementById('dr-branch-' + rid);
  var itemSel  = document.getElementById('dr-item-' + rid);
  var priceEl  = document.getElementById('dr-price-' + rid);
  var costEl   = document.getElementById('dr-cost-' + rid);

  if (!brand) {
    branchEl.value = '';
    itemSel.innerHTML = '<option value="">請先選品牌</option>';
    priceEl.value = '';
    costEl.value  = '';
    return;
  }

  branchEl.value = brand.branch;
  itemSel.innerHTML = '<option value="">請選擇餐點</option>' + brand.items.map(function(it) {
    return '<option value="' + escHtml(it.name) + '" data-price="' + it.price + '" data-cost="' + it.cost + '">' + escHtml(it.name) + '</option>';
  }).join('');
  priceEl.value = '';
  costEl.value  = '';
}

function onItemChange(rid) {
  var itemSel = document.getElementById('dr-item-' + rid);
  var opt     = itemSel.options[itemSel.selectedIndex];
  document.getElementById('dr-price-' + rid).value = opt ? (opt.getAttribute('data-price') || '') : '';
  document.getElementById('dr-cost-'  + rid).value = opt ? (opt.getAttribute('data-cost')  || '') : '';
}

function saveNewOrder() {
  var mealDate  = document.getElementById('no_mealDate').value;
  var serviceId = document.getElementById('no_serviceId').value;
  var memberId  = document.getElementById('no_memberId').value;

  if (!mealDate || !serviceId || !memberId) {
    showToast('請填寫出餐日期、餐期服務編號與會員編號');
    return;
  }
  if (!newDetailRows.length) {
    showToast('請至少新增一筆訂單明細');
    return;
  }

  // 驗證明細
  var hasError = false;
  newDetailRows.forEach(function(rid) {
    var brand = document.getElementById('dr-brand-' + rid).value;
    var item  = document.getElementById('dr-item-' + rid).value;
    var qty   = parseInt(document.getElementById('dr-qty-' + rid).value) || 0;
    if (!brand || !item || qty < 1) hasError = true;
  });
  if (hasError) {
    showToast('請確認所有明細的品牌、餐點與數量均已填寫');
    return;
  }

  var orderId = document.getElementById('no_orderId').textContent;
  var svc = SERVICE_MAP[serviceId];
  var periodCode = svc ? svc.period : '';
  var today = new Date().toISOString().slice(0, 10);

  // 建立訂單
  var newOrder = {
    id: orderId, createdAt: today, mealDate: mealDate,
    site: document.getElementById('no_site').value,
    type: 'S', period: periodCode, memberId: memberId,
    phone: document.getElementById('no_phone').value,
    status: '已成立',
  };

  // 建立明細
  var details = newDetailRows.map(function(rid) {
    return {
      brand: document.getElementById('dr-brand-' + rid).value,
      item:  document.getElementById('dr-item-' + rid).value,
      qty:   parseInt(document.getElementById('dr-qty-' + rid).value) || 1,
      price: parseInt(document.getElementById('dr-price-' + rid).value) || 0,
    };
  });

  ORDERS.unshift(newOrder);
  ORDER_DETAILS[orderId] = details;

  closeNewOrderDrawer();
  renderTable();
  showToast('✅ 特殊訂單 ' + orderId + ' 已成立');
}

/* ════════════════════════════════
   工具
════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var _toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { t.style.display = 'none'; }, 3500);
}

   初始化
════════════════════════════════ */
var _today = new Date().toISOString().slice(0, 10);
document.getElementById('dateFrom').value = daysAgo(6);
document.getElementById('dateTo').value   = _today;
updateDateRangeLabel();
renderTable();
